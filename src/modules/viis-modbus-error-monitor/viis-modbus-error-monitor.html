<script type="text/javascript">
    RED.nodes.registerType('viis-modbus-error-monitor', {
        category: 'VIIS',
        color: '#ff6b6b',
        defaults: {
            name: { value: "" },
            deviceType: { value: "", required: true },
            pollInterval: { value: 5000, required: true, validate: RED.validators.number() },
            boardId: { value: "" },
            entity: { value: "" },
            enableAutoResolve: { value: true }
        },
        inputs: 1,
        outputs: 2,
        outputLabels: ["error detected", "error resolved"],
        icon: "alert.svg",
        label: function() {
            return this.name || `Error Monitor (${this.deviceType})`;
        },
        labelStyle: function() {
            return this.name ? "node_label_italic" : "";
        },
        paletteLabel: "error modbus monitor"
    });
</script>

<script type="text/html" data-template-name="viis-modbus-error-monitor">

    </div>

    <div class="form-row">
        <label for="node-input-deviceType"><i class="fa fa-cogs"></i> Device Type</label>
        <input type="text" id="node-input-deviceType" placeholder="e.g., Climate_Controller">
    </div>

    <div class="form-row">
        <label for="node-input-pollInterval"><i class="fa fa-clock-o"></i> Poll Interval (ms)</label>
        <input type="number" id="node-input-pollInterval" placeholder="5000" min="1000">
    </div>

    <div class="form-row">
        <label for="node-input-boardId"><i class="fa fa-microchip"></i> Board ID</label>
        <input type="text" id="node-input-boardId" placeholder="Optional: board1, board2, etc.">
    </div>

    <div class="form-row">
        <label for="node-input-entity"><i class="fa fa-cube"></i> Entity</label>
        <input type="text" id="node-input-entity" placeholder="Optional: device_001, greenhouse_1, etc.">
    </div>

    <div class="form-row">
        <label for="node-input-enableAutoResolve" style="width: auto;">
            <input type="checkbox" id="node-input-enableAutoResolve" style="display:inline-block; width:auto; margin:0;">
            Enable Auto-Resolve
        </label>
    </div>

    <div class="form-tips">
        <p><b>Device Type:</b> Must match a device type in your error code JSON files (e.g., Climate_Controller, Irrigation_System).</p>
        <p><b>Poll Interval:</b> How often to check Modbus registers for errors (minimum 1000ms).</p>
        <p><b>Board ID:</b> For multi-board setups. Leave empty for single-board or default board.</p>
        <p><b>Entity:</b> Identifier for the device/entity being monitored. Defaults to node ID if empty.</p>
        <p><b>Auto-Resolve:</b> Automatically mark notifications as resolved when errors clear.</p>
    </div>
</script>

<script type="text/html" data-help-name="viis-modbus-error-monitor">
    <p>Monitors Modbus registers and coils for errors, automatically creating notifications.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">string</span></dt>
        <dd>Control commands: "poll", "start", "stop"</dd>
        <dt>topic <span class="property-type">string</span></dt>
        <dd>Control commands: "poll", "start", "stop"</dd>
    </dl>

    <h3>Outputs</h3>
    <ol class="node-ports">
        <li>Error Detected
            <dl class="message-properties">
                <dt>payload <span class="property-type">object</span></dt>
                <dd>Error information including notification, register, and value</dd>
                <dt>topic <span class="property-type">string</span></dt>
                <dd>"error"</dd>
            </dl>
        </li>
        <li>Error Resolved
            <dl class="message-properties">
                <dt>payload <span class="property-type">object</span></dt>
                <dd>Resolved error information including register and device type</dd>
                <dt>topic <span class="property-type">string</span></dt>
                <dd>"resolved"</dd>
            </dl>
        </li>
    </ol>

    <h3>Details</h3>
    <p>This node continuously polls Modbus registers/coils for errors based on the configured device type's error mapping.</p>
    <p>When an error is detected, it automatically creates a notification in the database and outputs the error information.</p>
    <p>When auto-resolve is enabled and an error clears (register = 0 or coil = false), it automatically marks the notification as resolved.</p>

    <h3>Configuration</h3>
    <ul>
        <li><b>Device Type:</b> Must match error code JSON file (e.g., Climate_Controller)</li>
        <li><b>Poll Interval:</b> Frequency of Modbus polling in milliseconds (min 1000ms)</li>
        <li><b>Board ID:</b> Optional board identifier for multi-board Modbus setups</li>
        <li><b>Entity:</b> Device/entity identifier (defaults to node ID)</li>
        <li><b>Auto-Resolve:</b> Automatically resolve cleared errors</li>
    </ul>

    <h3>Status</h3>
    <ul>
        <li><b>Green ring:</b> No errors detected</li>
        <li><b>Red dot:</b> Active errors detected</li>
        <li><b>Green dot:</b> Errors resolved</li>
        <li><b>Blue dot:</b> Currently polling</li>
        <li><b>Yellow ring:</b> No error mapping found</li>
        <li><b>Red ring:</b> Polling failed</li>
    </ul>

    <h3>References</h3>
    <ul>
        <li><a href="https://github.com/viis-iot">VIIS IoT Platform</a> - Documentation</li>
    </ul>
</script>
