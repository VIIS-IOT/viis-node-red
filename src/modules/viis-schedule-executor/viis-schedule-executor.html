<script type="text/html" data-template-name="viis-schedule-executor">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-clock-o"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Schedule Executor">
    </div>
    <div class="form-row">
        <label><i class="fa fa-exchange"></i> MQTT Publishing</label>
        <div style="margin-left: 20px; color: #666; font-size: 12px;">
            Publishes to both ThingsBoard and EMQX Local brokers
        </div>
    </div>
    <div class="form-row">
        <label for="node-input-description"><i class="fa fa-info-circle"></i> Description</label>
        <input type="text" id="node-input-description" placeholder="Optional description">
    </div>
    <div class="form-row">
        <label for="node-input-debugEnable"><i class="fa fa-bug"></i> Enable Debug</label>
        <input type="checkbox" id="node-input-debugEnable" style="width: auto;">
    </div>
    <div class="form-row">
        <label for="node-input-verifyAfterWrite"><i class="fa fa-check-circle"></i> Verify After Write</label>
        <input type="checkbox" id="node-input-verifyAfterWrite" style="width: auto;">
        <div style="margin-left: 105px; color: #666; font-size: 11px;">
            Verify After Write / Skip Coil Verify control read-back only. Failed keys notify the user; the schedule still goes running/finished.
        </div>
    </div>
    <div class="form-row">
        <label for="node-input-skipCoilVerify"><i class="fa fa-toggle-on"></i> Skip Coil Verify</label>
        <input type="checkbox" id="node-input-skipCoilVerify" style="width: auto;">
        <div style="margin-left: 105px; color: #666; font-size: 11px;">
            Skip coil (FC=5) read-back after that key's write. Default: enabled (skip). Does not change running/finished status.
        </div>
    </div>
    <div class="form-row">
        <label for="node-input-cleanupInterval"><i class="fa fa-trash-o"></i> Cleanup Interval (minutes)</label>
        <input type="number" id="node-input-cleanupInterval" placeholder="8" min="1">
        <div style="margin-left: 105px; color: #666; font-size: 11px;">
            Interval to clean stale 'running' entries from status history
        </div>
    </div>
    <div class="form-row">
        <label for="node-input-waterHammerDelay"><i class="fa fa-hourglass-half"></i> Valve/Power Delay (seconds)</label>
        <input type="number" id="node-input-waterHammerDelay" placeholder="7" min="0" step="1">
        <div style="margin-left: 105px; color: #666; font-size: 11px;">
            Wait after opening valves before pump/power (START), and after stopping pumps before closing valves (FINISH). Default: 7. Deploy applies immediately.
        </div>
    </div>
</script>

<script type="text/javascript">
    RED.nodes.registerType('viis-schedule-executor', {
        category: 'function',
        color: "#a6bbcf",
        defaults: {
            name: { value: "" },
            description: { value: "" },
            debugEnable: { value: false },
            verifyAfterWrite: { value: true },
            skipCoilVerify: { value: true },
            cleanupInterval: { value: 15, required: true },
            waterHammerDelay: {
                value: 7,
                required: false,
                validate: function (v) {
                    if (v === undefined || v === null || String(v).trim() === '') {
                        return true;
                    }
                    var n = Number(v);
                    return isFinite(n) && n >= 0;
                }
            }
        },
        inputs: 1,
        outputs: 1,
        icon: "../../icons/logo.png",
        label: function () {
            return this.name || "viis-schedule-executor";
        },
        oneditprepare: function () {
            if (this.waterHammerDelay === undefined || this.waterHammerDelay === null || this.waterHammerDelay === '') {
                $('#node-input-waterHammerDelay').val(7);
            }
        },
        oneditsave: function () {
            var $el = $('#node-input-waterHammerDelay');
            var v = $el.val();
            if (v === undefined || v === null || String(v).trim() === '') {
                $el.val(7);
                this.waterHammerDelay = 7;
            }
        }
    });
</script>

<script type="text/html" data-help-name="viis-schedule-executor">
    <p>
        The <b>VIIS Schedule Executor</b> node is designed to process scheduled actions.
        It reads schedules from the database, checks if they are due based on the defined time range,
        maps schedule actions to Modbus commands, writes each key (optional read-back + per-key retry),
        and synchronizes schedule status with MQTT notifications and backend logs.
        Verify After Write / Skip Coil Verify control read-back only. Failed keys notify the user; the schedule still goes running/finished.
    </p>
    <p>
        <b>MQTT Publishing:</b> Automatically publishes schedule status to both ThingsBoard and EMQX Local brokers.
    </p>
    <p>
        <b>Usage:</b> Connect an Inject node to this node to trigger schedule checks at your desired interval.
    </p>
    <p>
        <b>Description:</b> An optional field to provide additional information about this node.
    </p>
    <p>
        <b>Cleanup Interval:</b> The interval (in minutes) at which the node cleans up stale 'running' entries from schedule status history. Default is 15 minutes.
    </p>
    <p>
        <b>Valve/Power Delay:</b> Seconds to wait between the valve group and the pump/power group.
        Used on START (valves first, then delay, then pumps/power) and FINISH (pumps off, then delay, then valves).
        Default is 7 seconds. Changing the value and clicking Deploy applies it immediately.
    </p>
</script>
