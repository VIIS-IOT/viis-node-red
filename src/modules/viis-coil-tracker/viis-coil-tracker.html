<script type="text/html" data-template-name="viis-coil-tracker">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Coil Tracker">
    </div>

    <div class="form-row">
        <label style="width: 100%;"><i class="fa fa-list"></i> Tracking Rules</label>
        <div id="node-input-trackers-container" style="min-height: 150px; border: 1px solid #ddd; border-radius: 4px; padding: 10px; margin-top: 5px;">
            <!-- Dynamic tracker rows will be inserted here -->
        </div>
    </div>

    <div class="form-row" style="margin-top: 10px;">
        <button type="button" id="add-tracker-btn" class="red-ui-button" style="margin-left: 105px;">
            <i class="fa fa-plus"></i> Add Tracking Rule
        </button>
    </div>

    <div class="form-row" style="margin-top: 15px;">
        <label><i class="fa fa-cog"></i> Options</label>
        <label style="width: auto; margin-left: 20px;">
            <input type="checkbox" id="node-input-storeToDatabase" style="width: auto; margin: 0;">
            <span style="margin-left: 5px;">Save to Database</span>
        </label>
        <label style="width: auto; margin-left: 20px;">
            <input type="checkbox" id="node-input-publishMqtt" style="width: auto; margin: 0;">
            <span style="margin-left: 5px;">Publish MQTT</span>
        </label>
    </div>
</script>

<style>
    .tracker-row {
        background: #f9f9f9;
        border: 1px solid #e3e3e3;
        border-radius: 4px;
        padding: 10px;
        margin-bottom: 10px;
        position: relative;
    }
    .tracker-row-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
    }
    .tracker-row-controls {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }
    .tracker-field {
        flex: 1;
        min-width: 200px;
    }
    .tracker-field label {
        display: block;
        font-size: 12px;
        color: #666;
        margin-bottom: 3px;
    }
    .tracker-field input {
        width: 100%;
        padding: 4px 8px;
        font-size: 13px;
    }
    .remove-tracker-btn {
        background: #d9534f;
        color: white;
        border: none;
        padding: 4px 10px;
        border-radius: 3px;
        cursor: pointer;
        font-size: 12px;
    }
    .remove-tracker-btn:hover {
        background: #c9302c;
    }
    .tracker-enabled-checkbox {
        margin-right: 5px;
    }
</style>

<script type="text/javascript">
    RED.nodes.registerType("viis-coil-tracker", {
        category: "function",
        color: "#98D2C0",
        defaults: {
            name: { value: "" },
            trackers: { value: [] },
            storeToDatabase: { value: true },
            publishMqtt: { value: true }
        },
        inputs: 0,
        outputs: 1,
        icon: "timer.png",
        label: function () {
            return this.name || "viis-coil-tracker";
        },
        oneditprepare: function() {
            const node = this;
            const container = $("#node-input-trackers-container");

            // Initialize trackers array if not exists
            if (!node.trackers) {
                node.trackers = [];
            }

            // Function to create a tracker row
            function createTrackerRow(tracker, index) {
                const row = $(`
                    <div class="tracker-row" data-index="${index}">
                        <div class="tracker-row-header">
                            <label>
                                <input type="checkbox" class="tracker-enabled-checkbox" ${tracker.enabled ? 'checked' : ''}>
                                <strong>Rule #${index + 1}</strong>
                            </label>
                            <button type="button" class="remove-tracker-btn">
                                <i class="fa fa-times"></i> Remove
                            </button>
                        </div>
                        <div class="tracker-row-controls">
                            <div class="tracker-field">
                                <label>Tracking Key <span style="color: red;">*</span></label>
                                <input type="text" class="tracker-key" placeholder="e.g., mixing_operation" value="${tracker.trackingKey || ''}">
                            </div>
                            <div class="tracker-field">
                                <label>Coil Key <span style="color: red;">*</span></label>
                                <input type="text" class="tracker-coil" placeholder="e.g., COIL_AUTO_TRON" value="${tracker.coilKey || ''}">
                            </div>
                            <div class="tracker-field">
                                <label>Board ID (optional)</label>
                                <input type="text" class="tracker-board" placeholder="e.g., board1" value="${tracker.boardId || ''}">
                            </div>
                            <div class="tracker-field" style="flex: 2; min-width: 100%;">
                                <label>Capture Related Data (comma-separated)</label>
                                <input type="text" class="tracker-data" placeholder="e.g., current_ec,current_ph,volume_iri" value="${tracker.captureRelatedData ? tracker.captureRelatedData.join(',') : ''}">
                            </div>
                        </div>
                    </div>
                `);

                // Remove button handler
                row.find('.remove-tracker-btn').on('click', function() {
                    row.remove();
                    updateRowNumbers();
                });

                return row;
            }

            // Function to update row numbers
            function updateRowNumbers() {
                container.find('.tracker-row').each(function(idx) {
                    $(this).attr('data-index', idx);
                    $(this).find('.tracker-row-header strong').text(`Rule #${idx + 1}`);
                });
            }

            // Load existing trackers
            node.trackers.forEach((tracker, index) => {
                container.append(createTrackerRow(tracker, index));
            });

            // Add tracker button
            $("#add-tracker-btn").on('click', function() {
                const newIndex = container.find('.tracker-row').length;
                const newTracker = {
                    trackingKey: '',
                    coilKey: '',
                    boardId: '',
                    captureRelatedData: [],
                    enabled: true
                };
                container.append(createTrackerRow(newTracker, newIndex));
            });
        },
        oneditsave: function() {
            const node = this;
            const trackers = [];

            $("#node-input-trackers-container .tracker-row").each(function() {
                const row = $(this);
                const dataString = row.find('.tracker-data').val().trim();

                trackers.push({
                    trackingKey: row.find('.tracker-key').val().trim(),
                    coilKey: row.find('.tracker-coil').val().trim(),
                    boardId: row.find('.tracker-board').val().trim(),
                    captureRelatedData: dataString ? dataString.split(',').map(s => s.trim()) : [],
                    enabled: row.find('.tracker-enabled-checkbox').is(':checked')
                });
            });

            node.trackers = trackers;
        }
    });
</script>

<script type="text/html" data-help-name="viis-coil-tracker">
    <h3>🔍 VIIS Coil State Tracker</h3>
    <p>Monitors coil states from global context and tracks ON/OFF duration with related telemetry data.</p>

    <h4>⚙️ Configuration</h4>
    <ul>
        <li><b>Name</b> – Optional label for this node</li>
        <li><b>Tracking Rules</b> – Define which coils to track and what data to capture</li>
        <li><b>Save to Database</b> – Store sessions in MySQL (requires table migration)</li>
        <li><b>Publish MQTT</b> – Publish state change events to EMQX local broker</li>
    </ul>

    <h4>📋 Tracking Rule Fields</h4>
    <ul>
        <li><b>Tracking Key</b> – User-friendly identifier (e.g., "mixing_operation")</li>
        <li><b>Coil Key</b> – Key from <code>coilRegisterData</code> (e.g., "COIL_AUTO_TRON")</li>
        <li><b>Board ID</b> – Optional board identifier for multi-board setups</li>
        <li><b>Capture Related Data</b> – Comma-separated keys to capture from registers (e.g., "current_ec,current_ph")</li>
        <li><b>Enabled</b> – Checkbox to enable/disable this rule</li>
    </ul>

    <h4>🔄 How It Works</h4>
    <ol>
        <li>Monitors <code>global.coilRegisterData</code> every 1 second</li>
        <li>Detects OFF→ON transition: Creates new session, captures start data</li>
        <li>Detects ON→OFF transition: Completes session, calculates duration, captures end data</li>
        <li>Publishes MQTT event (if enabled) to <code>viis/things/v2/{deviceId}/coil-tracking/{trackingKey}</code></li>
        <li>Saves session to database (if enabled)</li>
        <li>Sends output message with session details</li>
    </ol>

    <h4>📤 Output Message</h4>
    <p>On state changes, the node outputs:</p>
    <pre>
{
  topic: "coil-tracking/mixing_operation/start",
  payload: {
    event: "start" | "complete",
    trackingKey: "mixing_operation",
    sessionId: "mixing_operation_1735096234567",
    startTime: "2025-12-25T10:03:54.567Z",
    endTime: "2025-12-25T10:08:24.789Z", // only for "complete"
    durationSeconds: 270, // only for "complete"
    coilValue: true | false,
    relatedData: {
      current_ec: 1450,
      current_ph: 650,
      ...
    }
  }
}
    </pre>

    <h4>📡 MQTT Payload</h4>
    <pre>
{
  "event": "state_change",
  "tracking_key": "mixing_operation",
  "session_id": "mixing_operation_1735096234567",
  "state": "started" | "completed",
  "timestamp": "2025-12-25T10:03:54.567Z",
  "duration_seconds": 270, // only for "completed"
  "data": { ... }
}
    </pre>

    <h4>🗄️ Database Schema</h4>
    <p>If database storage is enabled, create this table:</p>
    <pre>
CREATE TABLE IF NOT EXISTS tabiot_coil_tracking_session (
    name VARCHAR(140) PRIMARY KEY,
    tracking_key VARCHAR(100) NOT NULL,
    coil_key VARCHAR(100) NOT NULL,
    board_id VARCHAR(50),
    device_id VARCHAR(140),
    start_time DATETIME NOT NULL,
    end_time DATETIME,
    duration_seconds INT,
    status ENUM('active', 'completed') DEFAULT 'active',
    start_snapshot JSON,
    end_snapshot JSON,
    creation DATETIME,
    modified DATETIME,
    INDEX idx_tracking_key (tracking_key),
    INDEX idx_device_status (device_id, status)
);
    </pre>

    <h4>🧠 Global Context Used</h4>
    <ul>
        <li><code>coilRegisterData</code> – Real-time coil states</li>
        <li><code>inputRegisterData</code> – Input register values (for capture)</li>
        <li><code>holdingRegisterData</code> – Holding register values (for capture)</li>
    </ul>

    <h4>💡 Example Use Cases</h4>
    <ul>
        <li>Track mixing operation duration with EC/pH values</li>
        <li>Monitor pump runtime and pressure</li>
        <li>Log irrigation valve operations with flow rates</li>
        <li>Measure equipment operating hours</li>
    </ul>

    <h4>🧹 Cleanup</h4>
    <p>Automatically stops monitoring and releases clients when node is closed.</p>
</script>
