<script type="text/javascript">
    RED.nodes.registerType('viis-schedule-executor-v2', {
        category: 'VIIS V2',
        color: '#3FADB5',
        defaults: {
            name: { value: "" },
            description: { value: "" },
            debugEnable: { value: false },
            verifyAfterWrite: { value: true },
            boardMode: { value: 'auto' },
            boardId: { value: "" }
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-cog",
        align: "right",
        label: function () {
            return this.name || "viis-schedule-executor-v2";
        },
        labelStyle: function () {
            return this.name ? "node_label_italic" : "";
        },
        oneditprepare: function () {
            // Initialize board mode select
            if (!this.boardMode) {
                this.boardMode = 'auto';
            }
            
            // Show/hide boardId field based on boardMode
            const updateBoardIdVisibility = () => {
                const mode = $("#node-input-boardMode").val();
                if (mode === 'multi') {
                    $("#node-input-boardId-row").show();
                } else {
                    $("#node-input-boardId-row").hide();
                }
            };
            
            $("#node-input-boardMode").on("change", updateBoardIdVisibility);
            updateBoardIdVisibility();
        }
    });
</script>

<script type="text/html" data-help-name="viis-schedule-executor-v2">
    <h3>viis-schedule-executor-v2</h3>
    <p>Executes Modbus commands, verifies writes, publishes MQTT telemetry, and syncs schedule status.</p>
    
    <h4>Responsibilities</h4>
    <ul>
        <li>Execute holding register commands (FC 6)</li>
        <li>Execute coil commands (FC 5) with proper sequencing</li>
        <li>Verify writes by reading back values</li>
        <li>Track active commands per schedule</li>
        <li>Reset commands to safe state</li>
        <li>Handle valve/pump sequencing (valves first on start, pumps first on stop)</li>
        <li><strong>Publish MQTT telemetry</strong> to ThingsBoard + EMQX</li>
        <li><strong>Publish audit logs</strong> for schedule execution events</li>
        <li><strong>Send HTTP notifications</strong> to backend on status changes</li>
        <li><strong>Sync schedule log</strong> to backend database</li>
        <li><strong>Update schedule status</strong> in local DB and sync to server</li>
    </ul>
    
    <h4>Input</h4>
    <dl class="message-properties">
        <dt>msg.payload<span class="property-type">object</span></dt>
        <dd>
            <ul>
                <li><code>allowed</code>: Boolean - execution permission</li>
                <li><code>commands</code>: Array of Modbus commands</li>
                <li><code>schedule</code>: Optional schedule object</li>
                <li><code>configParameters</code>: Optional config parameters (unmapped keys)</li>
            </ul>
        </dd>
    </dl>
    
    <h4>Output</h4>
    <dl class="message-properties">
        <dt>msg.payload<span class="property-type">object</span></dt>
        <dd>
            <ul>
                <li><code>success</code>: Boolean - execution result</li>
                <li><code>executedCommands</code>: Number of commands executed</li>
                <li><code>failedCommands</code>: Number of failed commands</li>
                <li><code>errorMessage</code>: Error details if failed</li>
            </ul>
        </dd>
        <dt>msg.topic<span class="property-type">string</span></dt>
        <dd>Always "schedule-executor-v2" or "schedule-executor-v2-error"</dd>
    </dl>
    
    <h4>Configuration</h4>
    <dl class="message-properties">
        <dt>Board Mode<span class="property-type">string</span></dt>
        <dd>Auto/Single/Multi board mode selection</dd>
        <dt>Board ID<span class="property-type">string</span></dt>
        <dd>Specific board ID for multi-board setups</dd>
        <dt>Verify<span class="property-type">boolean</span></dt>
        <dd>Enable write verification (reads back after writing)</dd>
        <dt>Debug<span class="property-type">boolean</span></dt>
        <dd>Enable debug logging</dd>
    </dl>
    
    <h4>Details</h4>
    <p>This node is the THIRD (final) in the V2 chain. It:</p>
    <ul>
        <li><strong>Start Sequence</strong>: Valves first → 5s delay → Pumps/Power</li>
        <li><strong>Finish Sequence</strong>: Pumps/Power first → 5s delay → Valves</li>
        <li><strong>Verification</strong>: Reads back values after writing to confirm</li>
        <li><strong>Tracking</strong>: Keeps track of active commands per schedule</li>
        <li><strong>MQTT Telemetry</strong>: Publishes written keys to ThingsBoard + EMQX (deduplicated)</li>
        <li><strong>Audit Logs</strong>: Publishes execution audit with metadata (from DEVICE_EXE_SCHEDULE)</li>
        <li><strong>HTTP Notification</strong>: Sends alarm notification to backend on start/end</li>
        <li><strong>DB Sync</strong>: Updates schedule status in DB and syncs to server</li>
        <li><strong>Schedule Log</strong>: Logs execution to backend schedule_log table</li>
    </ul>
    <p>Connect this after <strong>viis-schedule-logic-v2</strong>.</p>
    
    <h4>RPC Commands</h4>
    <p>Supports remote reset:</p>
    <pre><code>{
  "method": "reset_schedule",
  "params": { "scheduleId": "schedule-name" }
}</code></pre>
    
    <h4>Wiring Example</h4>
    <pre>inject → trigger-v2 → logic-v2 → executor-v2 → debug</pre>
</script>
