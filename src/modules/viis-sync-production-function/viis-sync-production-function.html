<!--
  VIIS Sync Production Function Node
  This node synchronizes production functions between the local database and server
-->

<script type="text/html" data-template-name="viis-sync-production-function">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-thingsboardAccessToken"><i class="fa fa-key"></i> Access Token</label>
        <input type="text" id="node-input-thingsboardAccessToken" placeholder="Auto-loaded from DEVICE_ACCESS_TOKENenv">
        <div style="margin-left: 105px; color: #666; font-size: 11px;">
            Optional - Auto-loads from DEVICE_ACCESS_TOKENenvironment variable if not provided
        </div>
    </div>
    <div class="form-row">
        <label for="node-input-useEnvAccessToken"><i class="fa fa-toggle-on"></i> Use Env Variable</label>
        <input type="checkbox" id="node-input-useEnvAccessToken" style="width: auto;">
        <div style="margin-left: 105px; color: #666; font-size: 11px;">
            Always load from DEVICE_ACCESS_TOKENenvironment variable (ignore input above)
        </div>
    </div>
    <div class="form-row">
        <label for="node-input-syncInterval"><i class="fa fa-clock-o"></i> Sync Interval (min)</label>
        <input type="number" id="node-input-syncInterval" min="0" placeholder="60">
    </div>
    <div class="form-row">
        <label for="node-input-syncOnStartup"><i class="fa fa-play"></i> Sync on Startup</label>
        <input type="checkbox" id="node-input-syncOnStartup" style="width: auto;" checked>
    </div>
    <div class="form-row">
        <label for="node-input-showDetailedLogs"><i class="fa fa-list"></i> Detailed Logs</label>
        <input type="checkbox" id="node-input-showDetailedLogs" style="width: auto;">
    </div>
    <div class="form-row">
        <label for="node-input-maxRetries"><i class="fa fa-repeat"></i> Max Retries</label>
        <input type="number" id="node-input-maxRetries" min="1" max="10" placeholder="3">
    </div>
</script>

<script type="text/html" data-help-name="viis-sync-production-function">
    <p>A node for synchronizing production functions between VIIS IoT server and local database.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload
            <span class="property-type">object | any</span>
        </dt>
        <dd>Any input message will trigger a manual sync operation. The message payload can be of any type.</dd>
    </dl>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload
            <span class="property-type">object</span>
        </dt>
        <dd>
            <p>Contains the result of the sync operation:</p>
            <ul>
                <li><code>status</code> - "success" or "error"</li>
                <li><code>message</code> - Description of the result</li>
                <li><code>result</code> - Detailed sync statistics (only on success)</li>
            </ul>
        </dd>
    </dl>

    <h3>Details</h3>
    <p>This node synchronizes production functions between the VIIS IoT server and the local database. It performs the following operations:</p>
    <ul>
        <li>Fetches production function data from the VIIS IoT server using ThingsBoard access token</li>
        <li>Receives functions with custom labels already merged from <code>tabiot_function_custom_setting</code></li>
        <li>Only receives visible functions (hidden functions are filtered by backend)</li>
        <li>Creates new production functions in the local database if they don't exist</li>
        <li>Updates existing production functions if the server version is newer</li>
        <li>Maintains device profile relationships for production functions</li>
        <li>Syncs all custom labels including checkbox bit labels</li>
    </ul>

    <h3>Configuration</h3>
    <ul>
        <li><code>Access Token</code> - (Optional) ThingsBoard access token for authentication with the VIIS IoT API. If not provided, will auto-load from DEVICE_ACCESS_TOKENenvironment variable.</li>
        <li><code>Use Env Variable</code> - When checked, always loads from DEVICE_ACCESS_TOKENenvironment variable and ignores the Access Token input field.</li>
        <li><code>Sync Interval</code> - How often to automatically sync (in minutes, 0 to disable)</li>
        <li><code>Sync on Startup</code> - Whether to perform a sync when the node starts</li>
        <li><code>Detailed Logs</code> - Enable to see more detailed log information</li>
        <li><code>Max Retries</code> - Maximum number of retry attempts for API calls</li>
    </ul>
</script>

<script type="text/javascript">
    RED.nodes.registerType('viis-sync-production-function', {
        category: 'VIIS IoT',
        color: '#a6bbcf',
        defaults: {
            name: { value: "" },
            thingsboardAccessToken: { value: "", required: false },
            useEnvAccessToken: { value: false },
            syncInterval: { value: 60, required: true, validate: RED.validators.number() },
            syncOnStartup: { value: true },
            showDetailedLogs: { value: false },
            maxRetries: { value: 3, required: true, validate: RED.validators.number() }
        },
        inputs: 1,
        outputs: 1,
        icon: "sync.png",
        label: function () {
            return this.name || "viis-sync-production-function";
        },
        paletteLabel: "sync production function",
        inputLabels: ["trigger sync"],
        outputLabels: ["sync result"],
        oneditprepare: function() {
            // Disable access token input when useEnvAccessToken is checked
            const updateAccessTokenState = function() {
                const useEnv = $('#node-input-useEnvAccessToken').is(':checked');
                $('#node-input-thingsboardAccessToken').prop('disabled', useEnv);
                if (useEnv) {
                    $('#node-input-thingsboardAccessToken').val('');
                }
            };

            $('#node-input-useEnvAccessToken').on('change', updateAccessTokenState);
            updateAccessTokenState();
        }
    });
</script>
