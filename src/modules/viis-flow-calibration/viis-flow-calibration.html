<script type="text/javascript">
    RED.nodes.registerType('viis-flow-calibration', {
        category: 'VIIS IoT',
        color: '#87CEEB',
        defaults: {
            name: { value: "" },
            checkInterval: { value: 2000 },
            enableLogging: { value: false },
            calibrateBoard1: { value: true },
            calibrateBoard2: { value: true }
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-sliders",
        label: function() {
            return this.name || "viis-flow-calibration";
        },
        paletteLabel: "Flow Calibration",
        labelStyle: function() {
            return this.name ? "node_label_italic" : "";
        }
    });
</script>

<script type="text/html" data-template-name="viis-flow-calibration">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>

    <div class="form-row">
        <label for="node-input-checkInterval"><i class="fa fa-clock-o"></i> Check Interval (ms)</label>
        <input type="number" id="node-input-checkInterval" placeholder="2000" min="500" max="60000">
    </div>
    
    <div class="form-row">
        <label for="node-input-enableLogging" style="width:auto"><i class="fa fa-list"></i> Enable Logging</label>
        <input type="checkbox" id="node-input-enableLogging" style="display:inline-block; width:auto; vertical-align:top;">
    </div>

    <div class="form-row">
        <label style="width:auto"><i class="fa fa-cogs"></i> Calibrate Boards:</label>
    </div>

    <div class="form-row" style="padding-left: 20px;">
        <label for="node-input-calibrateBoard1" style="width:auto">
            <input type="checkbox" id="node-input-calibrateBoard1" style="display:inline-block; width:auto; vertical-align:top;">
            Board 1 (Pump Control)
        </label>
    </div>

    <div class="form-row" style="padding-left: 20px;">
        <label for="node-input-calibrateBoard2" style="width:auto">
            <input type="checkbox" id="node-input-calibrateBoard2" style="display:inline-block; width:auto; vertical-align:top;">
            Board 2 (Flow Sensor)
        </label>
    </div>
</script>

<script type="text/html" data-help-name="viis-flow-calibration">
    <p>A custom Node-RED node for calibrating flow sensors and pumps.</p>
    
    <h3>Overview</h3>
    <p>This node monitors global context for calibration flags and performs calibration calculations for both:</p>
    <ul>
        <li><strong>Board1 (Pump Control)</strong>: Updates HOLDING_CALIB_BOM_{i}</li>
        <li><strong>Board2 (Flow Sensor)</strong>: Updates K-Factor and Expected Pump Flowrate</li>
    </ul>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>topic <span class="property-type">string</span></dt>
        <dd><code>calculate</code> - Trigger manual calibration</dd>
        <dd><code>status</code> - Get current calibration status</dd>
        <dd><code>check</code> - Force check calibration flags</dd>
    </dl>

    <dl class="message-properties">
        <dt>payload (for topic=calculate) <span class="property-type">object</span></dt>
        <dd><code>pumpIndex</code> - Pump number (1-16)</dd>
        <dd><code>actualMl</code> - Measured volume in mL</dd>
        <dd><code>setMl</code> - Target volume in mL</dd>
    </dl>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>topic <span class="property-type">string</span></dt>
        <dd><code>calibration_complete</code> - Automatic calibration result</dd>
        <dd><code>manual_calibration_complete</code> - Manual calibration result</dd>
    </dl>

    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>Contains calibration results and statistics</dd>
    </dl>

    <h3>Calibration Algorithm</h3>
    <h4>Board1 (Pump Control):</h4>
    <pre>
runTime = setMl / currentCalib
newCalib = actualMl / runTime
    </pre>

    <h4>Board2 (Flow Sensor):</h4>
    <pre>
K_new = K_old × (V_reported / V_real)
Q_new = V_real / runTime
    </pre>

    <h3>Global Context Keys</h3>
    <ul>
        <li><code>CALCULATE_CALIB_BOM_{i}</code> - Set to true to trigger calibration</li>
        <li><code>CALIB_ACTUAL_ML_BOM_{i}</code> - User measured volume in mL</li>
    </ul>

    <h3>Configuration</h3>
    <ul>
        <li><strong>Check Interval</strong>: How often to check for calibration flags (default: 2000ms)</li>
        <li><strong>Enable Logging</strong>: Enable detailed debug logging</li>
        <li><strong>Calibrate Board 1</strong>: Enable pump control board calibration</li>
        <li><strong>Calibrate Board 2</strong>: Enable flow sensor board calibration</li>
    </ul>
</script>
