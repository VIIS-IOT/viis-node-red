<script type="text/javascript">
    RED.nodes.registerType('viis-auto-microclimate-control', {
        category: 'VIIS',
        color: '#4CAF50',
        defaults: {
            name: { value: "" },
            pollingInterval: { value: 10000, validate: RED.validators.number() },
            enableFanControl: { value: true },
            enableWaterPumpControl: { value: true },
            enableCurtainControl: { value: true }
        },
        inputs: 1,
        outputs: 1,
        icon: "logo.png",
        label: function() {
            return this.name || "Auto Microclimate Control";
        },
        labelStyle: function() {
            return this.name ? "node_label_italic" : "";
        },
        oneditprepare: function() {
            // Initialize form values
            $("#node-input-pollingInterval").val(this.pollingInterval || 10000);
            $("#node-input-enableFanControl").prop('checked', this.enableFanControl !== false);
            $("#node-input-enableWaterPumpControl").prop('checked', this.enableWaterPumpControl !== false);
            $("#node-input-enableCurtainControl").prop('checked', this.enableCurtainControl !== false);
            
            // Add validation for polling interval
            $("#node-input-pollingInterval").on('input', function() {
                var value = parseInt($(this).val());
                if (value < 1000) {
                    $(this).addClass('input-error');
                    $("#polling-interval-help").text("Minimum polling interval is 1000ms (1 second)");
                } else {
                    $(this).removeClass('input-error');
                    $("#polling-interval-help").text("Interval between control cycles in milliseconds");
                }
            });
        },
        oneditsave: function() {
            // Ensure minimum polling interval
            var pollingInterval = parseInt($("#node-input-pollingInterval").val());
            if (pollingInterval < 1000) {
                pollingInterval = 1000;
            }
            this.pollingInterval = pollingInterval;
        }
    });
</script>

<script type="text/html" data-template-name="viis-auto-microclimate-control">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Auto Microclimate Control">
    </div>
    
    <div class="form-row">
        <label for="node-input-pollingInterval"><i class="fa fa-clock-o"></i> Polling Interval (ms)</label>
        <input type="number" id="node-input-pollingInterval" placeholder="10000" min="1000" step="1000">
        <div class="form-tips" id="polling-interval-help">Interval between control cycles in milliseconds</div>
    </div>
    
    <div class="form-row">
        <label style="width: auto; margin-right: 10px;">
            <input type="checkbox" id="node-input-enableFanControl" style="width: auto; margin-right: 5px;">
            Enable Fan Control
        </label>
        <div class="form-tips">Automatic control of fans based on temperature and humidity</div>
    </div>
    
    <div class="form-row">
        <label style="width: auto; margin-right: 10px;">
            <input type="checkbox" id="node-input-enableWaterPumpControl" style="width: auto; margin-right: 5px;">
            Enable Water Pump Control
        </label>
        <div class="form-tips">Automatic control of water pump based on humidity thresholds</div>
    </div>
    
    <div class="form-row">
        <label style="width: auto; margin-right: 10px;">
            <input type="checkbox" id="node-input-enableCurtainControl" style="width: auto; margin-right: 5px;">
            Enable Curtain Control
        </label>
        <div class="form-tips">Automatic control of curtains based on light levels</div>
    </div>
</script>

<script type="text/html" data-help-name="viis-auto-microclimate-control">
    <p>VIIS Auto Microclimate Control Node provides automatic control for greenhouse equipment based on sensor data.</p>
    
    <h3>Features</h3>
    <ul>
        <li><strong>Fan Control:</strong> Automatic fan control with rotation and threshold modes</li>
        <li><strong>Water Pump Control:</strong> Humidity-based water pump automation</li>
        <li><strong>Curtain Control:</strong> Light-based curtain control with tolerance timers</li>
    </ul>
    
    <h3>Configuration</h3>
    <p>The node reads configuration from the global variable <code>configKeyValues</code> which should contain:</p>
    
    <h4>Fan Control Settings</h4>
    <ul>
        <li><code>set_mode_fan</code>: Enable/disable fan control (0=off, 1=on)</li>
        <li><code>set_auto_mode_fan</code>: Fan mode (0=threshold, 1=rotation)</li>
        <li><code>set_k1_fan</code> to <code>set_k4_fan</code>: Temperature thresholds</li>
        <li><code>set_gr_alternate_fan</code>: Group size for rotation (2, 4, or 6)</li>
        <li><code>set_time_alternate_fan</code>: Rotation interval in minutes</li>
    </ul>
    
    <h4>Water Pump Settings</h4>
    <ul>
        <li><code>set_mode_tuong_nuoc</code>: Enable/disable water pump control (0=off, 1=on)</li>
        <li><code>set_threshold_low_water_bump</code>: Low humidity threshold (%)</li>
        <li><code>set_threshold_high_water_bump</code>: High humidity threshold (%)</li>
    </ul>
    
    <h4>Curtain Settings</h4>
    <ul>
        <li><code>set_mode_luoi</code>: Enable/disable curtain control (0=off, 1=on)</li>
        <li><code>set_light_dai_luoi_1/2</code>: Light threshold for extending curtains (lux)</li>
        <li><code>set_light_thu_luoi_1/2</code>: Light threshold for retracting curtains (lux)</li>
        <li><code>set_tolerance_light_luoi_1/2</code>: Tolerance time in minutes</li>
    </ul>
    
    <h3>Input Data</h3>
    <p>The node reads sensor data from global variables:</p>
    <ul>
        <li><code>holdingRegisterData</code>: Temperature, humidity, and light sensor data</li>
        <li><code>coilRegisterData</code>: Current device status</li>
    </ul>
    
    <h3>Control Logic</h3>
    
    <h4>Fan Control</h4>
    <ul>
        <li><strong>Threshold Mode:</strong> Fans activate based on temperature/humidity thresholds (K1-K4)</li>
        <li><strong>Rotation Mode:</strong> Fan groups rotate at specified intervals</li>
        <li><strong>Priority:</strong> K4 threshold has highest priority and activates all fans</li>
    </ul>
    
    <h4>Water Pump Control</h4>
    <ul>
        <li>Activates when humidity falls below low threshold</li>
        <li>Deactivates when humidity rises above high threshold</li>
        <li>K4 override: Pump activates during extreme conditions</li>
    </ul>
    
    <h4>Curtain Control</h4>
    <ul>
        <li>Each curtain (luoi) has two coils: thu (retract) and dai (extend)</li>
        <li>Tolerance timers prevent rapid switching</li>
        <li>Only one coil can be active at a time per curtain</li>
    </ul>
    
    <h3>Input Commands</h3>
    <p>Send commands via input messages:</p>
    <pre>
{
  "payload": {
    "command": "start|stop|execute|status|updateInterval",
    "params": { "interval": 5000 }
  }
}
    </pre>
    
    <h3>Output</h3>
    <p>The node outputs control execution results:</p>
    <pre>
{
  "payload": {
    "timestamp": 1234567890,
    "success": true,
    "actionsExecuted": 3,
    "errors": 0,
    "sensorData": { ... },
    "controlStatus": { ... },
    "actions": [ ... ]
  }
}
    </pre>
    
    <h3>Environment Variables</h3>
    <p>Required environment variables for Modbus configuration:</p>
    <ul>
        <li><code>MODBUS_COILS</code>: JSON mapping of device keys to coil addresses</li>
        <li><code>MODBUS_HOLDING_REGISTERS</code>: JSON mapping for holding registers</li>
        <li><code>MODBUS_TYPE</code>, <code>MODBUS_HOST</code>, etc.: Modbus connection settings</li>
    </ul>
</script>
