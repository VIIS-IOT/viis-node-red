<script type="text/javascript">
    RED.nodes.registerType('viis-modbus-getter', {
        category: 'VIIS',
        color: '#3FADB5',
        defaults: {
            name: { value: "" },
            enableLogging: { value: false }, // Add logging enable/disable option
            boardId: { value: "board1" } // Board ID for multi-board mode
        },
        inputs: 1,
        outputs: 1,
        icon: "viis-modbus-getter/logo.png",
        label: function () {
            return this.name || "VIIS Modbus Getter";
        },
        labelStyle: function () {
            return this.name ? "node_label_italic" : "";
        },
        oneditprepare: function () {
            // Initialize board selector dropdown
            var boardSelect = $("#node-input-boardId");
            
            // Default 3 board options
            var exampleBoards = [
                { id: "board1", name: "Board 1" },
                { id: "board2", name: "Board 2" },
                { id: "board3", name: "Board 3" }
            ];
            
            // Check if we have boards configured
            RED.nodes.eachConfig(function(config) {
                // This is a placeholder for dynamic board loading
                // In production, boards would come from backend
            });
            
            // Add board options
            exampleBoards.forEach(function(board) {
                var selected = (board.id === this.boardId) ? ' selected' : '';
                boardSelect.append('<option value="' + board.id + '"' + selected + '>' + 
                                 board.name + '</option>');
            }.bind(this));
        },
        oneditsave: function () {
            // Save any additional configuration if needed
        }
    });
</script>

<script type="text/html" data-template-name="viis-modbus-getter">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    
    <div class="form-row">
        <label for="node-input-boardId"><i class="fa fa-microchip"></i> Board</label>
        <select id="node-input-boardId" style="width: 70%;">
            <!-- Options populated dynamically in oneditprepare -->
        </select>
        <div class="form-tips" style="margin-top: 5px; margin-bottom: 10px;">
            <small><i class="fa fa-info-circle"></i> Select a board (default: Board 1). 
            You can override dynamically using <code>msg.payload.boardId</code></small>
        </div>
    </div>
    
    <div class="form-row">
        <label for="node-input-enableLogging"><i class="fa fa-file-text-o"></i> Enable Logging</label>
        <input type="checkbox" id="node-input-enableLogging" style="display: inline-block; width: auto; vertical-align: top;">
        <label for="node-input-enableLogging" style="width: auto; margin-left: 5px;">Enable detailed logging (terminal & debug)</label>
    </div>
    
    <div class="form-tips">
        <p><strong>Input:</strong> Message with payload containing modbus request:</p>
        <pre>{
  "fc": 3,        // Function code (1=Coils, 2=Discrete, 3=Holding, 4=Input)

  "boardId": "board2"  // Optional: specific board (overrides node config)
}</pre>
        <p><strong>Output:</strong> Array of values read from modbus or error object</p>
        <p><strong>Note:</strong> Uses shared modbus connection from environment variables</p>
        <p><strong>Logging:</strong> When enabled, detailed logs will be shown in Node-RED debug panel and terminal</p>
    </div>
</script>

<script type="text/html" data-help-name="viis-modbus-getter">
    <p>A custom Node-RED node for reading data from Modbus devices using shared connection resources.</p>
    
    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>Modbus request object containing:
            <ul>
                <li><code>fc</code> (number): Function code (1=Read Coils, 2=Read Discrete Inputs, 3=Read Holding Registers, 4=Read Input Registers)</li>
                <li><code>unitid</code> (number): Modbus unit ID</li>
                <li><code>address</code> (number): Starting address to read from</li>
                <li><code>quantity</code> (number): Number of registers/coils to read</li>
                <li><code>boardId</code> (string): Optional - Specific board ID for multi-board mode (overrides node configuration)</li>
            </ul>
        </dd>
    </dl>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>On success: Object containing:
            <ul>
                <li><code>success</code> (boolean): true</li>
                <li><code>data</code> (array): Array of values read from modbus</li>
                <li><code>address</code> (number): Starting address</li>
                <li><code>quantity</code> (number): Number of values read</li>
                <li><code>functionCode</code> (number): Function code used</li>
                <li><code>timestamp</code> (number): Timestamp of the operation</li>
            </ul>
        </dd>
        <dt>payload <span class="property-type">object</span></dt>
        <dd>On error: Object containing:
            <ul>
                <li><code>error</code> (string): Error message</li>
                <li><code>timestamp</code> (number): Timestamp of the error</li>
            </ul>
        </dd>
    </dl>

    <h3>Configuration</h3>
    <p>This node uses shared modbus connection configured through environment variables:</p>
    <ul>
        <li><code>MODBUS_TYPE</code>: Connection type (TCP or RTU)</li>
        <li><code>MODBUS_HOST</code>: Host address for TCP connection</li>
        <li><code>MODBUS_TCP_PORT</code>: Port for TCP connection (default: 502)</li>
        <li><code>MODBUS_UNIT_ID</code>: Default unit ID (default: 1)</li>
        <li><code>MODBUS_TIMEOUT</code>: Connection timeout in ms (default: 5000)</li>
    </ul>

    <h3>Logging Configuration</h3>
    <p>The <strong>Enable Logging</strong> checkbox controls detailed logging output:</p>
    <ul>
        <li><strong>Enabled:</strong> Shows detailed operation logs in Node-RED debug panel and terminal</li>
        <li><strong>Disabled:</strong> Only shows critical errors and basic status updates</li>
    </ul>

    <h3>Example Usage</h3>
    <p>To read 10 holding registers starting from address 0:</p>
    <pre>msg.payload = {
    "fc": 3,
    "unitid": 1,
    "address": 0,
    "quantity": 10
};
return msg;</pre>

    <h3>Details</h3>
    <p>This node provides a simple interface for reading data from Modbus devices. It uses the shared modbus client from the VIIS system, ensuring efficient resource usage when multiple nodes need to communicate with the same Modbus device.</p>
    
    <p>The node validates all input parameters and provides detailed error messages for troubleshooting. It supports all standard Modbus read function codes and handles both coil/discrete input (boolean) and register (numeric) data types.</p>
</script>
