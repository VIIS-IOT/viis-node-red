<script type="text/html" data-template-name="viis-rest-api">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="VIIS REST API Server">
    </div>
    
    <div class="form-row">
        <label for="node-input-enabled"><i class="fa fa-power-off"></i> Enabled</label>
        <input type="checkbox" id="node-input-enabled" style="display: inline-block; width: auto; vertical-align: top;">
        <span style="margin-left: 10px;">Enable REST API server</span>
    </div>
    
    <div class="form-row">
        <label for="node-input-apiPrefix"><i class="fa fa-link"></i> API Prefix</label>
        <input type="text" id="node-input-apiPrefix" placeholder="/api/v2">
        <div class="form-tips">Base path for all API endpoints (e.g., /api/v2)</div>
    </div>
    
    <div class="form-row">
        <label for="node-input-jwtSecret"><i class="fa fa-key"></i> JWT Secret</label>
        <input type="password" id="node-input-jwtSecret" placeholder="Leave empty to use environment variable">
        <div class="form-tips">JWT secret key for token signing (uses JWT_SECRET env var if empty)</div>
    </div>
    
    <hr>
    <h4>Security & Performance</h4>
    
    <div class="form-row">
        <label for="node-input-enableCors"><i class="fa fa-globe"></i> Enable CORS</label>
        <input type="checkbox" id="node-input-enableCors" style="display: inline-block; width: auto; vertical-align: top;">
        <span style="margin-left: 10px;">Allow cross-origin requests</span>
    </div>
    
    <div class="form-row">
        <label for="node-input-enableRateLimit"><i class="fa fa-tachometer"></i> Rate Limiting</label>
        <input type="checkbox" id="node-input-enableRateLimit" style="display: inline-block; width: auto; vertical-align: top;">
        <span style="margin-left: 10px;">Enable rate limiting</span>
    </div>
    
    <div class="form-row">
        <label for="node-input-maxRequestsPerMinute"><i class="fa fa-clock-o"></i> Max Requests/Min</label>
        <input type="number" id="node-input-maxRequestsPerMinute" placeholder="100" min="1" max="10000">
        <div class="form-tips">Maximum requests per minute per IP address</div>
    </div>
    
    <hr>
    <h4>Logging</h4>
    
    <div class="form-row">
        <label for="node-input-enableLogging"><i class="fa fa-file-text-o"></i> Enable Logging</label>
        <input type="checkbox" id="node-input-enableLogging" style="display: inline-block; width: auto; vertical-align: top;">
        <span style="margin-left: 10px;">Log API requests and responses</span>
    </div>
    
    <hr>
    <div class="form-tips">
        <strong>Available Endpoints:</strong><br>
        • POST {apiPrefix}/auth/login - User authentication<br>
        • POST {apiPrefix}/auth/logout - User logout<br>
        • GET {apiPrefix}/auth/verify - Token verification<br>
        • GET {apiPrefix}/users - Get all users (admin only)<br>
        • GET {apiPrefix}/users/me - Get current user info<br>
        • GET {apiPrefix}/devices - Get devices for customer<br>
        • GET {apiPrefix}/telemetry/latest/:deviceId - Get latest telemetry<br>
        • GET {apiPrefix}/health - Health check<br>
    </div>
</script>

<script type="text/javascript">
    RED.nodes.registerType('viis-rest-api', {
        category: 'VIIS IoT',
        color: '#44C4A1',
        defaults: {
            name: { value: "" },
            enabled: { value: true },
            apiPrefix: { value: "/api/v2" },
            enableLogging: { value: true },
            enableCors: { value: true },
            jwtSecret: { value: "" },
            enableRateLimit: { value: true },
            maxRequestsPerMinute: { value: 100, validate: RED.validators.number() }
        },
        inputs: 0,
        outputs: 0,
        icon: "icons/shield.png",
        label: function () {
            return this.name || "VIIS REST API";
        },
        labelStyle: function () {
            return this.name ? "node_label_italic" : "";
        },
        oneditprepare: function () {
            // Initialize form values
            $("#node-input-enabled").prop('checked', this.enabled !== false);
            $("#node-input-enableLogging").prop('checked', this.enableLogging !== false);
            $("#node-input-enableCors").prop('checked', this.enableCors !== false);
            $("#node-input-enableRateLimit").prop('checked', this.enableRateLimit !== false);
            
            // Set default values if empty
            if (!this.apiPrefix) {
                $("#node-input-apiPrefix").val("/api/v2");
            }
            if (!this.maxRequestsPerMinute) {
                $("#node-input-maxRequestsPerMinute").val(100);
            }
            
            // Show/hide rate limit options
            function toggleRateLimit() {
                const enabled = $("#node-input-enableRateLimit").is(':checked');
                $("#node-input-maxRequestsPerMinute").closest('.form-row').toggle(enabled);
            }
            
            $("#node-input-enableRateLimit").change(toggleRateLimit);
            toggleRateLimit();
        },
        oneditsave: function () {
            // Ensure boolean values are properly saved
            this.enabled = $("#node-input-enabled").is(':checked');
            this.enableLogging = $("#node-input-enableLogging").is(':checked');
            this.enableCors = $("#node-input-enableCors").is(':checked');
            this.enableRateLimit = $("#node-input-enableRateLimit").is(':checked');
        }
    });
</script>

<style>
    .form-tips {
        font-size: 11px;
        color: #666;
        margin-top: 3px;
        line-height: 1.3;
    }
    
    .form-row hr {
        margin: 15px 0;
        border: none;
        border-top: 1px solid #ddd;
    }
    
    .form-row h4 {
        margin: 10px 0 5px 0;
        color: #333;
        font-size: 13px;
        font-weight: bold;
    }
</style>
