<script type="text/javascript">
    RED.nodes.registerType('viis-flow-error-monitor', {
        category: 'VIIS',
        color: '#FFA07A',
        defaults: {
            name: { value: "" },
            toleranceRunning: { value: 0.2, validate: RED.validators.number() },
            toleranceStopped: { value: 0.03, validate: RED.validators.number() },
            debounceMinutes: { value: 3, validate: RED.validators.number() },
            enableTestMode: { value: true },
            enableDebugLogs: { value: false }
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-tint",
        label: function () {
            return this.name || "Flow Error Monitor";
        },
        labelStyle: function () {
            return this.name ? "node_label_italic" : "";
        },
        button: {
            enabled: function() { return this.enableTestMode; },
            visible: function() { return this.enableTestMode; },
            onclick: function() {
                var node = this;
                var label = this.name || 'flow-error-monitor';
                $.ajax({
                    url: 'viis-flow-error-monitor/' + node.id,
                    type: 'POST',
                    success: function(resp) {
                        RED.notify('Test notification sent for ' + label, 'success');
                    },
                    error: function(jqXHR, textStatus, errorThrown) {
                        if (jqXHR.status == 404) {
                            RED.notify('Node endpoint not found. Trying alternative method...', 'warning');
                        } else {
                            RED.notify('Failed to send test: ' + textStatus, 'error');
                        }
                    }
                });
            }
        }
    });
</script>

    </div>
</script>

<script type="text/html" data-help-name="viis-flow-error-monitor">
    <p>Monitors irrigation flow rates and detects errors automatically.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>trigger <span class="property-type">any</span></dt>
        <dd>Any message will trigger a flow check cycle.</dd>
    </dl>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>Modbus command to stop pump if critical error detected (F5).</dd>
    </dl>

    <h3>Details</h3>
    <p>This node monitors flow rates across multiple channels (A1, B1, B2, A2, A3, B3) and detects two types of errors:</p>
    <ul>
        <li><strong>F4 Error:</strong> Flow rate deviation beyond tolerance when machine stops</li>
        <li><strong>F5 Error:</strong> Critical low flow in first minute (air leak or fertilizer exhaustion) - auto-stops pump</li>
    </ul>

    <h3>Configuration</h3>
    <dl class="message-properties">
        <dt>Tolerance (Stopped)</dt>
        <dd>Acceptable deviation when machine stops (default: 0.03 = 3%)</dd>

        <dt>Tolerance (Running)</dt>
        <dd>Acceptable deviation while running (default: 0.2 = 20%, currently not used)</dd>

        <dt>Debounce (min)</dt>
        <dd>Minimum minutes between error notifications to prevent spam (default: 3)</dd>
    </dl>

    <h3>Required Global Context</h3>
    <ul>
        <li><code>inputRegisterData</code> - Volume measurements (volume_A1..B3, set_irrigation_time_count)</li>
        <li><code>holdingRegisterData</code> - Set flow rates (set_flow_A1..B3, time_valve_A1..B3)</li>
        <li><code>coilRegisterData</code> - Machine status (main_pump, power)</li>
        <li><code>modbusErrMap</code> - Error code descriptions</li>
        <li><code>modbusCoils</code> - Coil address mappings</li>
        <li><code>device_label</code> - Device label for notifications</li>
        <li><code>moment</code> - Moment.js library</li>
    </ul>

    <h3>Behavior</h3>
    <p><strong>Machine Running:</strong></p>
    <ul>
        <li>First minute (1-1.5 min): Checks if flow is at least 80% of expected. If not, stops pump and creates F5 error.</li>
        <li>After 1.5 minutes: Tracks elapsed time but only checks on stop.</li>
    </ul>

    <p><strong>Machine Stopped:</strong></p>
    <ul>
        <li>Checks all channels with strict tolerance (3% by default)</li>
        <li>Creates F4 error notifications for out-of-tolerance channels</li>
    </ul>

    <h3>Error Notifications</h3>
    <p>Errors are sent to:</p>
    <ul>
        <li>Local database (TabiotNotification)</li>
        <li>Backend API via HTTP POST to <code>/api/v2/alarm/notification-by-token</code></li>
    </ul>

    <h3>Status Display</h3>
    <ul>
        <li><strong>Grey ring:</strong> Ready, not started</li>
        <li><strong>Green ring:</strong> Machine idle</li>
        <li><strong>Blue ring:</strong> Waiting for minimum running time (< 1 min)</li>
        <li><strong>Yellow dot:</strong> Initial flow check (1-1.5 min)</li>
        <li><strong>Green dot:</strong> Machine running normally</li>
        <li><strong>Red ring:</strong> Flow error detected</li>
    </ul>

    <h3>References</h3>
    <ul>
        <li><a href="https://docs.viis.tech" target="_blank">VIIS Documentation</a></li>
    </ul>
</script>
