<script type="text/html" data-help-name="viis-schedule-rpc">
    <h3>viis-schedule-rpc</h3>
    <p>Routes schedule-related RPC commands to appropriate outputs.</p>
    
    <h4>Responsibilities</h4>
    <ul>
        <li>Receive RPC messages from upstream MQTT subscriber</li>
        <li>Route by method to 5 outputs</li>
        <li>Log unknown methods</li>
    </ul>
    
    <h4>Input</h4>
    <dl class="message-properties">
        <dt>msg.payload<span class="property-type">object</span></dt>
        <dd>
            <ul>
                <li><code>method</code>: RPC method name</li>
                <li><code>params</code>: RPC parameters (optional)</li>
            </ul>
        </dd>
    </dl>
    
    <h4>Outputs</h4>
    <dl class="message-properties">
        <dt>Output 1<span class="property-type">msg</span></dt>
        <dd><code>schedule-disable-by-backend</code></dd>
        <dt>Output 2<span class="property-type">msg</span></dt>
        <dd><code>confirm-devices-off</code></dd>
        <dt>Output 3<span class="property-type">msg</span></dt>
        <dd><code>control</code> (general Modbus control)</dd>
        <dt>Output 4<span class="property-type">msg</span></dt>
        <dd><code>set_control_mode</code></dd>
        <dt>Output 5<span class="property-type">msg</span></dt>
        <dd>Unknown/other methods</dd>
    </dl>
    
    <h4>Wiring</h4>
    <pre>[viis-mqtt-client: RPC subscribe] → [viis-schedule-rpc] → [switch by output]</pre>
</script>
