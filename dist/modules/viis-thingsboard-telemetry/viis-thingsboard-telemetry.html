<script type="text/javascript">
    RED.nodes.registerType('viis-thingsboard-telemetry', {
        category: 'VIIS',
        color: '#4ec8dd',
        defaults: {
            name: { value: "" },
            batchSize: { value: 10, validate: RED.validators.number() },
            flushInterval: { value: 5000, validate: RED.validators.number() },
            maxRetries: { value: 3, validate: RED.validators.number() },
            retryInterval: { value: 30000, validate: RED.validators.number() },
            failedRetryInterval: { value: 300000, validate: RED.validators.number() },
            maxFailedRetries: { value: 10, validate: RED.validators.number() },
            enableRetry: { value: true },
            enableLogging: { value: false }
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-cloud-upload",
        label: function () {
            return this.name || "TB Telemetry";
        },
        labelStyle: function () {
            return this.name ? "node_label_italic" : "";
        },
        oneditprepare: function () {
            // Initialize tooltips if needed
            $("#node-input-batchSize").attr('title', 'Number of telemetry records to batch before sending');
            $("#node-input-flushInterval").attr('title', 'Auto-flush interval in milliseconds (e.g., 5000 = 5 seconds)');
            $("#node-input-maxRetries").attr('title', 'Maximum number of retry attempts before marking as failed');
            $("#node-input-retryInterval").attr('title', 'Interval between retry attempts in milliseconds');
            $("#node-input-failedRetryInterval").attr('title', 'Retry interval for failed records (default: 5 minutes)');
            $("#node-input-maxFailedRetries").attr('title', 'Max additional retries for failed records (0 = unlimited)');
        },
        oneditsave: function () {
            // Validation before save
            const batchSize = parseInt($("#node-input-batchSize").val());
            const flushInterval = parseInt($("#node-input-flushInterval").val());
            const maxRetries = parseInt($("#node-input-maxRetries").val());
            const retryInterval = parseInt($("#node-input-retryInterval").val());

            if (batchSize < 1 || batchSize > 100) {
                RED.notify("Batch size must be between 1 and 100", "warning");
            }
            if (flushInterval < 1000) {
                RED.notify("Flush interval should be at least 1000ms", "warning");
            }
            if (maxRetries < 0 || maxRetries > 10) {
                RED.notify("Max retries must be between 0 and 10", "warning");
            }
            if (retryInterval < 5000) {
                RED.notify("Retry interval should be at least 5000ms", "warning");
            }
        }
    });
</script>

<script type="text/html" data-template-name="viis-thingsboard-telemetry">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="ThingsBoard Telemetry">
    </div>

    <div class="form-row">
        <label for="node-input-batchSize"><i class="fa fa-cubes"></i> Batch Size</label>
        <input type="number" id="node-input-batchSize" placeholder="10" min="1" max="100" style="width: 70px;">
        <span style="margin-left: 10px; color: #999;">Records per batch</span>
    </div>

    <div class="form-row">
        <label for="node-input-flushInterval"><i class="fa fa-clock-o"></i> Flush Interval</label>
        <input type="number" id="node-input-flushInterval" placeholder="5000" min="1000" step="1000" style="width: 100px;">
        <span style="margin-left: 10px; color: #999;">ms (auto-flush timer)</span>
    </div>

    <div class="form-row">
        <label for="node-input-maxRetries"><i class="fa fa-repeat"></i> Max Retries</label>
        <input type="number" id="node-input-maxRetries" placeholder="3" min="0" max="10" style="width: 70px;">
        <span style="margin-left: 10px; color: #999;">Retry attempts</span>
    </div>

    <div class="form-row">
        <label for="node-input-retryInterval"><i class="fa fa-hourglass"></i> Retry Interval</label>
        <input type="number" id="node-input-retryInterval" placeholder="30000" min="5000" step="5000" style="width: 100px;">
        <span style="margin-left: 10px; color: #999;">ms (pending retry)</span>
    </div>

    <div class="form-row">
        <label for="node-input-failedRetryInterval"><i class="fa fa-clock-o"></i> Failed Retry</label>
        <input type="number" id="node-input-failedRetryInterval" placeholder="300000" min="60000" step="60000" style="width: 100px;">
        <span style="margin-left: 10px; color: #999;">ms (failed records, default 5min)</span>
    </div>

    <div class="form-row">
        <label for="node-input-maxFailedRetries"><i class="fa fa-repeat"></i> Max Failed Retries</label>
        <input type="number" id="node-input-maxFailedRetries" placeholder="10" min="0" max="100" style="width: 70px;">
        <span style="margin-left: 10px; color: #999;">0 = unlimited</span>
    </div>

    <div class="form-row">
        <label for="node-input-enableRetry"><i class="fa fa-toggle-on"></i> Enable Retry</label>
        <input type="checkbox" id="node-input-enableRetry" style="display: inline-block; width: auto; margin: 0 0 0 10px;">
        <span style="margin-left: 10px; color: #999;">Auto-retry failed uploads</span>
    </div>

    <div class="form-row">
        <label for="node-input-enableLogging"><i class="fa fa-file-text-o"></i> Enable Logging</label>
        <input type="checkbox" id="node-input-enableLogging" style="display: inline-block; width: auto; margin: 0 0 0 10px;">
        <span style="margin-left: 10px; color: #999;">Debug logging</span>
    </div>
</script>

<script type="text/html" data-help-name="viis-thingsboard-telemetry">
    <p>Send telemetry data to ThingsBoard via HTTP API with batch support and automatic retry.</p>
    
    <h3>Configuration</h3>
    <dl class="message-properties">
        <dt>Batch Size <span class="property-type">number</span></dt>
        <dd>Number of telemetry records to accumulate before sending (default: 10)</dd>
        
        <dt>Flush Interval <span class="property-type">number</span></dt>
        <dd>Auto-flush timer in milliseconds (default: 5000ms = 5s)</dd>
        
        <dt>Max Retries <span class="property-type">number</span></dt>
        <dd>Maximum retry attempts for failed uploads (default: 3)</dd>
        
        <dt>Retry Interval <span class="property-type">number</span></dt>
        <dd>Interval between retry attempts for pending records (default: 30000ms = 30s)</dd>
        
        <dt>Failed Retry Interval <span class="property-type">number</span></dt>
        <dd>Retry interval for failed records with longer delay (default: 300000ms = 5 minutes)</dd>
        
        <dt>Max Failed Retries <span class="property-type">number</span></dt>
        <dd>Maximum additional retries for failed records. Set to 0 for unlimited retries (default: 10)</dd>
        
        <dt>Enable Retry <span class="property-type">boolean</span></dt>
        <dd>Enable automatic retry for failed uploads (default: true)</dd>
        
        <dt>Enable Logging <span class="property-type">boolean</span></dt>
        <dd>Enable debug logging for troubleshooting (default: false)</dd>
    </dl>

    <h3>Input</h3>
    <p>The node accepts telemetry data in multiple formats:</p>

    <h4>Format 1: Simple key-value object</h4>
    <pre>msg.payload = {
    temperature: 42,
    humidity: 73
};</pre>
    <p>Node will automatically add current timestamp.</p>

    <h4>Format 2: ThingsBoard format with timestamp</h4>
    <pre>msg.payload = {
    ts: 1451649600512,
    values: {
        temperature: 42,
        humidity: 73
    }
};</pre>

    <h4>Format 3: Batch array</h4>
    <pre>msg.payload = [
    { ts: 1451649600512, values: { temperature: 42 } },
    { ts: 1451649600513, values: { temperature: 43 } }
];</pre>

    <h3>Output</h3>
    <p>The node outputs statistics after processing:</p>
    <pre>msg.payload = {
    success: true,
    stats: {
        totalSent: 100,
        totalFailed: 2,
        totalRetried: 1,
        totalSuccess: 98,
        bufferSize: 0
    }
};</pre>

    <h3>Environment Variables</h3>
    <p>Required configuration in env file:</p>
    <ul>
        <li><code>VIIS_BACKEND</code> - ThingsBoard server URL (e.g., https://iot.viis.tech)</li>
        <li><code>DEVICE_ACCESS_TOKEN</code> - ThingsBoard device access token</li>
        <li><code>DEVICE_ID</code> - Device identifier (optional, for logging)</li>
    </ul>

    <h3>Features</h3>
    <ul>
        <li><b>Batch Upload</b>: Automatically batches telemetry for efficient network usage</li>
        <li><b>Auto Retry</b>: Failed uploads are saved to database and retried automatically</li>
        <li><b>Zero Data Loss</b>: All failed data is persisted and retried with exponential backoff</li>
        <li><b>Hot Reload</b>: Configuration changes in env files are detected automatically</li>
        <li><b>Statistics</b>: Real-time stats on sent, failed, and retried records</li>
    </ul>

    <h3>Database</h3>
    <p>Failed telemetry records are stored in <code>tabiot_thingsboard_telemetry_queue</code> table with status tracking.</p>

    <h3>Details</h3>
    <p>For more information, see: <a href="https://thingsboard.io/docs/reference/http-api/" target="_blank">ThingsBoard HTTP API Documentation</a></p>
</script>
