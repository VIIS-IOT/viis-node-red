<script type="text/html" data-template-name="viis-trip-realtime-telemetry">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Trip Realtime Telemetry">
    </div>

    <!-- Update Interval Section -->
    <div class="form-row">
        <label style="width: 100%; border-bottom: 2px solid #27ae60; padding-bottom: 5px;">
            <i class="fa fa-clock-o"></i> <strong>Update Interval</strong>
        </label>
    </div>
    
    <div class="form-row">
        <label for="node-input-updateInterval">
            <i class="fa fa-refresh"></i> Interval (seconds)
        </label>
        <select id="node-input-updateInterval" style="width:70%;">
            <option value="2">2 seconds (High frequency)</option>
            <option value="5" selected>5 seconds (Recommended)</option>
            <option value="10">10 seconds (Medium)</option>
            <option value="30">30 seconds (Low)</option>
            <option value="60">60 seconds (Minimal)</option>
        </select>
        <span class="form-tips">How often to publish trip accumulation data</span>
    </div>

    <!-- Features Section -->
    <div class="form-row">
        <label style="width: 100%; border-bottom: 2px solid #3498db; padding-bottom: 5px;">
            <i class="fa fa-cog"></i> <strong>Features</strong>
        </label>
    </div>

    <div class="form-row">
        <label for="node-input-includeConsumption">
            <i class="fa fa-calculator"></i> Include Machine Consumption
        </label>
        <input type="checkbox" id="node-input-includeConsumption" style="width:auto;" checked>
        <span class="form-tips">Calculate consumption per machine (flow_in - flow_return)</span>
    </div>

    <!-- MQTT Publishing Section -->
    <div class="form-row">
        <label style="width: 100%; border-bottom: 2px solid #e67e22; padding-bottom: 5px;">
            <i class="fa fa-paper-plane"></i> <strong>MQTT Publishing</strong>
        </label>
    </div>

    <div class="form-row">
        <label for="node-input-publishToMqtt">
            <i class="fa fa-toggle-on"></i> Publish to MQTT
        </label>
        <input type="checkbox" id="node-input-publishToMqtt" style="width:auto;" checked>
        <span class="form-tips">Send trip telemetry to ThingsBoard</span>
    </div>

    <div class="form-row">
        <label for="node-input-mqttTopic">
            <i class="fa fa-tag"></i> MQTT Topic

        <input type="text" id="node-input-mqttTopic" placeholder="v1/devices/me/telemetry">
        <span class="form-tips">ThingsBoard topic for trip data</span>
    </div>
</script>

<script type="text/html" data-help-name="viis-trip-realtime-telemetry">
    <p>Real-time trip accumulation monitoring for Marine IoT systems.</p>
    <p><strong>Purpose:</strong> Sends running totals from trip start at configurable intervals for dashboard monitoring.</p>
    
    <h3>Features</h3>
    <ul>
        <li><strong>Real-time Updates:</strong> Configurable interval (2s, 5s, 10s, 30s, 60s)</li>
        <li><strong>Trip Running Totals:</strong> Accumulated volume from trip start to current time</li>
        <li><strong>Machine Consumption:</strong> Calculates consumption per machine (optional)</li>
        <li><strong>Auto-detect:</strong> Only outputs when active trip exists</li>
        <li><strong>MQTT Publishing:</strong> Send to ThingsBoard for real-time dashboard</li>
    </ul>

    <h3>Configuration</h3>
    <dl class="message-properties">
        <dt>Update Interval</dt>
        <dd>How often to publish trip data (default: 5 seconds)</dd>
        
        <dt>Include Machine Consumption</dt>
        <dd>Calculate and include machine-specific consumption (flow_in - flow_return)</dd>
        
        <dt>Publish to MQTT</dt>
        <dd>Send telemetry to ThingsBoard via MQTT</dd>
        
        <dt>MQTT Topic</dt>
        <dd>ThingsBoard topic (default: "v1/devices/me/telemetry")</dd>
    </dl>

    <h3>Input Messages</h3>
    <dl class="message-properties">
        <dt>topic: "trigger"</dt>
        <dd>
            <strong>Manual trigger (immediate update):</strong>
            <pre>{
    topic: "trigger"
}</pre>
        </dd>
        
        <dt>topic: "status"</dt>
        <dd>
            <strong>Get node status:</strong>
            <pre>{
    topic: "status"
}</pre>
        </dd>
    </dl>

    <h3>Output Payload Format</h3>
    <p>Flat structure with trip running totals (ThingsBoard compatible):</p>
    <pre>{
    "ts": 1737453625000,
    "trip_id": "abc-123-xyz",
    "trip_start": "2025-01-20T10:00:00Z",
    "trip_status": "ACTIVE",
    "trip_duration_hours": 4.52,
    
    // Sensor running totals (from trip start)
    "fs01_trip_total_m3": 472.8,
    "fs01_trip_total_tons": 449.16,
    "fs01_trip_samples": 8136,
    "fs01_last_update": 1737453625000,
    "fs01_density": 950,
    "fs01_oil_profile": "BO_Generator",
    
    "fs02_trip_total_m3": 412.5,
    "fs02_trip_total_tons": 391.875,
    "fs02_trip_samples": 8136,
    
    // ... fs03-fs06
    
    // Machine consumption (if enabled)
    "machine1_consumption_m3": 60.3,
    "machine1_consumption_tons": 57.285,
    "machine1_flow_in": "fs01",
    "machine1_flow_return": "fs02",
    
    "machine2_consumption_m3": 45.7,
    "machine2_consumption_tons": 43.415,
    
    "machine3_consumption_m3": 38.2,
    "machine3_consumption_tons": 36.29,
    
    "total_consumption_m3": 144.2,
    "total_consumption_tons": 136.99
}</pre>

    <h3>Behavior</h3>
    <ul>
        <li><strong>No Active Trip:</strong> Node waits, no output</li>
        <li><strong>Trip Active:</strong> Outputs running totals at configured interval</li>
        <li><strong>Trip Ends:</strong> Node stops outputting automatically</li>
        <li><strong>Manual Trigger:</strong> Send {topic: "trigger"} for immediate update</li>
    </ul>

    <h3>Update Interval Guidelines</h3>
    <ul>
        <li><code>2 seconds</code> - Dashboard real-time monitoring (high MQTT load)</li>
        <li><code>5 seconds</code> - Recommended balance (43,200 msg/day)</li>
        <li><code>10 seconds</code> - Standard monitoring (21,600 msg/day)</li>
        <li><code>30 seconds</code> - Low frequency (2,880 msg/day)</li>
        <li><code>60 seconds</code> - Minimal updates (1,440 msg/day)</li>
    </ul>

    <h3>Machine Configuration</h3>
    <p>Default machine mapping:</p>
    <ul>
        <li><strong>Machine 1:</strong> fs01 (in) - fs02 (return)</li>
        <li><strong>Machine 2:</strong> fs03 (in) - fs04 (return)</li>
        <li><strong>Machine 3:</strong> fs05 (in) - fs06 (return)</li>
    </ul>

    <h3>Database</h3>
    <p>Reads from <code>tabiot_trip_accumulation</code> table (updated every 2 seconds by marine-telemetry).</p>

    <h3>Difference from viis-flow-accumulation</h3>
    <table>
        <tr>
            <th>Aspect</th>
            <th>viis-flow-accumulation</th>
            <th>viis-trip-realtime-telemetry</th>
        </tr>
        <tr>
            <td>Purpose</td>
            <td>Hourly historical data</td>
            <td>Real-time trip monitoring</td>
        </tr>
        <tr>
            <td>Frequency</td>
            <td>1 hour (cron: 5 * * * *)</td>
            <td>2-60 seconds (configurable)</td>
        </tr>
        <tr>
            <td>Scope</td>
            <td>Single hour only</td>
            <td>Trip start → current time</td>
        </tr>
        <tr>
            <td>Database</td>
            <td>tabiot_flow_accumulation</td>
            <td>tabiot_trip_accumulation</td>
        </tr>
        <tr>
            <td>Use case</td>
            <td>Reports & analytics</td>
            <td>Live dashboard</td>
        </tr>
    </table>
</script>

    .form-tips {
        display: block;
        font-size: 11px;

<script type="text/javascript">
    RED.nodes.registerType("viis-trip-realtime-telemetry", {
        category: "function",
        color: "#27ae60",
        defaults: {
            name: { value: "" },
            updateInterval: { value: 5, required: true },
            publishToMqtt: { value: true },
            mqttTopic: { value: "v1/devices/me/telemetry" },
            includeConsumption: { value: true },
        },
        inputs: 1,
        outputs: 1,
        icon: "inject.png",
        label: function () {
            return this.name || "trip-realtime";
        },
        oneditprepare: function () {
            $("#node-input-publishToMqtt").prop("checked", this.publishToMqtt !== false);
            $("#node-input-includeConsumption").prop("checked", this.includeConsumption !== false);
        },
        oneditsave: function () {
            this.publishToMqtt = $("#node-input-publishToMqtt").is(":checked");
            this.includeConsumption = $("#node-input-includeConsumption").is(":checked");
        }
    });
</script>
