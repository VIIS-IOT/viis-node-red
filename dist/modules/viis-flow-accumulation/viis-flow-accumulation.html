<script type="text/html" data-template-name="viis-flow-accumulation">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Flow Accumulation">
    </div>

    <!-- Auto Calculation Section -->
    <div class="form-row">
        <label style="width: 100%; border-bottom: 2px solid #3498db; padding-bottom: 5px;">
            <i class="fa fa-clock-o"></i> <strong>Auto Calculation</strong>
        </label>
    </div>

    <div class="form-row">
        <label for="node-input-enableAutoCalculation">
            <i class="fa fa-toggle-on"></i> Enable Auto Calculation
        </label>
        <input type="checkbox" id="node-input-enableAutoCalculation" style="width:auto;" checked>
        <span class="form-tips">Automatically calculate accumulation on schedule</span>
    </div>

    <div class="form-row">
        <label for="node-input-cronSchedule">
            <i class="fa fa-calendar"></i> Cron Schedule
        </label>
        <input type="text" id="node-input-cronSchedule" placeholder="5 * * * *">
        <span class="form-tips">
            Cron expression (default: 5 * * * * = 5 minutes past every hour)
            <br>Examples: "0 * * * *" (every hour), "*/30 * * * *" (every 30 min)
        </span>
    </div>

    <!-- MQTT Publishing Section -->
    <div class="form-row">
        <label style="width: 100%; border-bottom: 2px solid #27ae60; padding-bottom: 5px;">
            <i class="fa fa-paper-plane"></i> <strong>MQTT Publishing</strong>
        </label>
    </div>

    <div class="form-row">
        <label for="node-input-publishToMqtt">
            <i class="fa fa-toggle-on"></i> Publish to MQTT
        </label>
        <input type="checkbox" id="node-input-publishToMqtt" style="width:auto;" checked>
        <span class="form-tips">Send accumulation results to ThingsBoard</span>
    </div>

    <div class="form-row">
        <label for="node-input-mqttTopic">
            <i class="fa fa-tag"></i> MQTT Topic
        </label>
        <input type="text" id="node-input-mqttTopic" placeholder="leave empty for v1/device/{deviceId}/telemetry">
        <span class="form-tips">ThingsBoard topic for accumulation data</span>
    </div>

    <div class="form-row">
        <label for="node-input-useTfsKeyFormat">
            <i class="fa fa-key"></i> Use TFS Key Format
        </label>
        <input type="checkbox" id="node-input-useTfsKeyFormat" style="width:auto;">
        <span class="form-tips">Use tfs01_hourly_m3 instead of fs01_accumulated_m3</span>
    </div>

    <!-- Backfill Section -->
    <div class="form-row">
        <label style="width: 100%; border-bottom: 2px solid #e67e22; padding-bottom: 5px;">
            <i class="fa fa-database"></i> <strong>Backfill (Manual Trigger)</strong>
        </label>
    </div>

    <div class="form-row">
        <label for="node-input-enableBackfill">
            <i class="fa fa-toggle-on"></i> Enable Backfill
        </label>
        <input type="checkbox" id="node-input-enableBackfill" style="width:auto;">
        <span class="form-tips">Allow backfilling historical data via input messages</span>
    </div>
</script>

<script type="text/html" data-help-name="viis-flow-accumulation">
    <p>Calculate and publish hourly flow accumulation data for Marine IoT systems.</p>

    <h3>Features</h3>
    <ul>
        <li><strong>Scheduled Calculation:</strong> Automatically calculate accumulation every hour</li>
        <li><strong>Manual Trigger:</strong> Calculate specific hours on demand</li>
        <li><strong>Backfill:</strong> Fill in historical accumulation data</li>
        <li><strong>MQTT Publishing:</strong> Send results to ThingsBoard</li>
    </ul>

    <h3>Configuration</h3>
    <dl class="message-properties">
        <dt>Enable Auto Calculation</dt>
        <dd>When enabled, automatically calculates accumulation based on cron schedule</dd>

        <dt>Cron Schedule</dt>
        <dd>Cron expression for scheduling (default: "5 * * * *" = 5 min past every hour)</dd>

        <dt>Publish to MQTT</dt>
        <dd>Send accumulation results to ThingsBoard via MQTT</dd>

        <dt>MQTT Topic</dt>
        <dd>ThingsBoard topic (leave empty to use v1/device/{deviceId}/telemetry)</dd>
    </dl>

    <h3>Input Messages</h3>
    <dl class="message-properties">
        <dt>topic: "calculate"</dt>
        <dd>
            <strong>Manual calculation for specific hour:</strong>
            <pre>{
    topic: "calculate",
    payload: {
        hourStart: "2025-01-20T14:00:00Z"  // Optional, defaults to previous hour
    }
}</pre>
        </dd>

        <dt>topic: "backfill"</dt>
        <dd>
            <strong>Backfill historical data:</strong>
            <pre>{
    topic: "backfill",
    payload: {
        startDate: "2025-01-01T00:00:00Z",
        endDate: "2025-01-20T00:00:00Z"
    }
}</pre>
        </dd>

        <dt>topic: "status"</dt>
        <dd>
            <strong>Get node status:</strong>
            <pre>{
    topic: "status"
}</pre>
        </dd>
    </dl>

    <h3>Output</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">array</span></dt>
        <dd>
            Array of accumulation results:
            <pre>[
    {
        sensor_key: "fs01",
        hour_start: Date,
        hour_end: Date,
        avg_flow_m3h: 25.5,
        accumulated_m3: 25.5,
        accumulated_tons: 24.225,
        oil_profile_id: "BO_Generator",
        density_used: 950,
        sample_count: 60
    },
    // ... fs02-fs06
]</pre>
        </dd>
    </dl>

    <h3>MQTT Payload Format (ThingsBoard Compatible)</h3>
    <p>Flat structure with sensor-prefixed keys for easy ThingsBoard integration:</p>
    <pre>{
    "ts": 1737453600000,
    "hour_start": "2025-01-20T14:00:00Z",
    "hour_end": "2025-01-20T15:00:00Z",
    "fs01_avg_flow_m3h": 25.5,
    "fs01_accumulated_m3": 25.5,
    "fs01_accumulated_tons": 24.225,
    "fs01_oil_profile": "BO_Generator",
    "fs01_density": 950,
    "fs01_samples": 60,
    "fs02_avg_flow_m3h": 30.2,
    "fs02_accumulated_m3": 30.2,
    "fs02_accumulated_tons": 28.69,
    "fs02_oil_profile": "BO_Generator",
    "fs02_density": 950,
    "fs02_samples": 60
    // ... fs03-fs06
}</pre>
    <p><strong>Note:</strong> Device identification is handled via MQTT access token, not in payload.</p>

    <h3>Database</h3>
    <p>Saves accumulation data to <code>tabiot_flow_accumulation</code> table.</p>

    <h3>Cron Schedule Examples</h3>
    <ul>
        <li><code>5 * * * *</code> - Every hour at 5 minutes past (recommended)</li>
        <li><code>0 * * * *</code> - Every hour at the start</li>
        <li><code>*/30 * * * *</code> - Every 30 minutes</li>
        <li><code>0 */2 * * *</code> - Every 2 hours</li>
        <li><code>0 0 * * *</code> - Daily at midnight</li>
    </ul>
</script>

<style>
    .form-tips {
        display: block;
        font-size: 11px;
        color: #666;
        font-style: italic;
        margin-top: 2px;
        line-height: 1.4;
    }
</style>

<script type="text/javascript">
    RED.nodes.registerType("viis-flow-accumulation", {
        category: "function",
        color: "#3498db",
        defaults: {
            name: { value: "" },
            enableAutoCalculation: { value: true },
            cronSchedule: { value: "5 * * * *", required: true },
            publishToMqtt: { value: true },
            mqttTopic: { value: "" },
            useTfsKeyFormat: { value: false },
            enableBackfill: { value: false },
        },
        inputs: 1,
        outputs: 1,
        icon: "timer.png",
        label: function () {
            return this.name || "flow-accumulation";
        },
        oneditprepare: function () {
            $("#node-input-enableAutoCalculation").prop("checked", this.enableAutoCalculation !== false);
            $("#node-input-publishToMqtt").prop("checked", this.publishToMqtt !== false);
            $("#node-input-useTfsKeyFormat").prop("checked", this.useTfsKeyFormat === true);
            $("#node-input-enableBackfill").prop("checked", this.enableBackfill === true);
        },
        oneditsave: function () {
            this.enableAutoCalculation = $("#node-input-enableAutoCalculation").is(":checked");
            this.publishToMqtt = $("#node-input-publishToMqtt").is(":checked");
            this.useTfsKeyFormat = $("#node-input-useTfsKeyFormat").is(":checked");
            this.enableBackfill = $("#node-input-enableBackfill").is(":checked");
        }
    });
</script>
