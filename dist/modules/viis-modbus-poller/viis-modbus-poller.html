<script type="text/javascript">
    RED.nodes.registerType('viis-modbus-poller', {
        category: 'VIIS',
        color: '#3FADB5',
        defaults: {
            name: { value: "" },
            coilPollingInterval: { value: 1000, validate: RED.validators.number() },
            inputPollingInterval: { value: 1000, validate: RED.validators.number() },
            holdingPollingInterval: { value: 5000, validate: RED.validators.number() },
            coilQuantity: { value: 32, validate: RED.validators.number() },
            inputQuantity: { value: 26, validate: RED.validators.number() },
            holdingQuantity: { value: 29, validate: RED.validators.number() },
            enableDebugLog: { value: false },
            thresholdConfig: { value: "{}" },
            periodicSnapshotInterval: { value: 60000, validate: RED.validators.number() }
        },
        inputs: 0,
        outputs: 0,
        icon: "viis-modbus-poller/logo.png",
        label: function () {
            return this.name || "VIIS Modbus Poller";
        },
        labelStyle: function () {
            return this.name ? "node_label_italic" : "";
        },
        oneditprepare: function () {
            // Initialize threshold config editor
            $("#node-input-thresholdConfig").css("height", "150px");

            // Add validation for threshold config
            $("#node-input-thresholdConfig").on("blur", function () {
                try {
                    const value = $(this).val();
                    if (value && value.trim() !== "") {
                        JSON.parse(value);
                    }
                    $(this).removeClass("input-error");
                } catch (e) {
                    $(this).addClass("input-error");
                }
            });

            // Set up help tooltips
            $(".form-tips").each(function () {
                $(this).css({
                    "font-size": "12px",
                    "color": "#666",
                    "margin-top": "5px"
                });
            });
        },
        oneditsave: function () {
            // Validate threshold configuration before saving
            try {
                const thresholdConfig = $("#node-input-thresholdConfig").val();
                if (thresholdConfig && thresholdConfig.trim() !== "") {
                    JSON.parse(thresholdConfig);
                }
            } catch (e) {
                RED.notify("Invalid JSON in Threshold Configuration", "error");
                return false;
            }
        }
    });
</script>

<script type="text/html" data-template-name="viis-modbus-poller">

    <div class="form-row">
        <label for="node-input-holdingPollingInterval"><i class="fa fa-clock-o"></i> Holding Polling Interval</label>

        <div class="form-tips">Time interval in milliseconds for polling holding registers (minimum: 100ms)</div>

    <div class="form-row">
        <h4>Polling Quantities</h4>
    </div>

    <div class="form-row">

        <input type="number" id="node-input-coilQuantity" placeholder="32" min="1" max="2000">
        <div class="form-tips">Number of coils to read in each polling cycle (1-2000)</div>

    <div class="form-row">

        <input type="number" id="node-input-periodicSnapshotInterval" placeholder="60000" min="0">

    </div>

    <div class="form-row">
        <label for="node-input-thresholdConfig"><i class="fa fa-cog"></i> Threshold Configuration</label>
        <textarea id="node-input-thresholdConfig" placeholder='{"temperature": 0.5, "pressure": 1.0}' rows="6"></textarea>
        <div class="form-tips">
            JSON object defining threshold values for each data key. Only values that change beyond their threshold will trigger telemetry publishing.
            <br><strong>Example:</strong> <code>{"temperature": 0.5, "pressure": 1.0, "status": 0}</code>
            <br>Leave empty to use default threshold (0.1) for all numeric values.
        </div>

<script type="text/html" data-help-name="viis-modbus-poller">
    <p>A custom Node-RED node for polling Modbus data and publishing telemetry to MQTT brokers and MySQL database.</p>

    <h3>Features</h3>
    <ul>
        <li><strong>Multi-Register Polling:</strong> Supports coils, input registers, and holding registers</li>
        <li><strong>Threshold-Based Publishing:</strong> Only publishes data when values change beyond configured thresholds</li>
        <li><strong>Periodic Snapshots:</strong> Configurable periodic publishing regardless of threshold changes</li>
        <li><strong>Dual MQTT Publishing:</strong> Publishes to both Thingsboard and EMQX brokers</li>
        <li><strong>MySQL Storage:</strong> Saves telemetry data to MySQL database using TypeORM</li>
        <li><strong>Shared Resources:</strong> Uses ClientRegistry for efficient resource management</li>
    </ul>

    <h3>Configuration</h3>
    <dl class="message-properties">
        <dt>Polling Intervals</dt>
        <dd>Configure how often each register type is polled (in milliseconds)</dd>

        <dt>Polling Quantities</dt>
        <dd>Configure how many registers/coils to read in each polling cycle</dd>

        <dt>Threshold Configuration</dt>
        <dd>JSON object defining threshold values for change detection. Format: <code>{"key": threshold_value}</code></dd>

        <dt>Periodic Snapshot Interval</dt>
        <dd>Time interval for periodic data publishing regardless of threshold changes (0 = disabled)</dd>

        <dt>Enable Debug Log</dt>
        <dd>Enable detailed logging for troubleshooting and monitoring</dd>
    </dl>

    <h3>MQTT Topics</h3>
    <ul>
        <li><strong>Thingsboard:</strong> <code>v1/devices/me/telemetry</code></li>
        <li><strong>EMQX:</strong> <code>viis/things/v2/${deviceId}/telemetry</code></li>
    </ul>

    <h3>Environment Variables</h3>
    <p>This node uses shared connection configured through environment variables:</p>
    <ul>
        <li><code>DEVICE_ID</code>: Device identifier for MQTT topics</li>
        <li><code>MODBUS_*</code>: Modbus connection settings</li>
        <li><code>THINGSBOARD_*</code>: Thingsboard MQTT settings</li>
        <li><code>EMQX_*</code>: EMQX MQTT settings</li>
        <li><code>MODBUS_COILS</code>: JSON mapping of coil names to addresses</li>
        <li><code>MODBUS_INPUT_REGISTERS</code>: JSON mapping of input register names to addresses</li>
        <li><code>MODBUS_HOLDING_REGISTERS</code>: JSON mapping of holding register names to addresses</li>
    </ul>

    <h3>Data Processing</h3>
    <p>The node continuously polls Modbus data and:</p>
    <ol>
        <li>Compares current values with previous values</li>
        <li>Checks if changes exceed configured thresholds</li>
        <li>Publishes changed data to MQTT brokers</li>
        <li>Saves telemetry data to MySQL database</li>
        <li>Handles periodic snapshots based on time intervals</li>
    </ol>

    <h3>Error Handling</h3>
    <p>The node includes robust error handling:</p>
    <ul>
        <li>Automatic retry on connection failures</li>
        <li>Maximum consecutive failure limits</li>
        <li>Detailed error logging and status reporting</li>
        <li>Graceful degradation when services are unavailable</li>
    </ul>
</script>
