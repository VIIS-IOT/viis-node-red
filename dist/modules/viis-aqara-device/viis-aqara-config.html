<!--
  VIIS Aqara Configuration Node - UI Definition
  
  This file defines the Node-RED editor interface for the Aqara configuration node.
  It manages credentials for Aqara Open API authentication.
-->

<script type="text/javascript">
  RED.nodes.registerType("viis-aqara-config", {
    category: "config",
    defaults: {
      name: { value: "" }
    },
    credentials: {
      appid: { type: "text", required: true },
      keyid: { type: "text", required: true },
      appkey: { type: "password", required: true },
      accesstoken: { type: "password" }
    },
    label: function () {
      return this.name || "Aqara Config";
    },
    icon: "icons/spider-web.png",
    
    // Called when editor opens
    oneditprepare: function () {
      // Add test connection button after appkey field
      setTimeout(function() {
        if ($("#node-config-input-test-connection").length === 0) {
          const testButton = $(
            '<a href="#" id="node-config-input-test-connection" class="editor-button editor-button-small" style="margin-left: 10px;">' +
            'Test Connection' +
            '</a>'
          );
          
          testButton.on("click", function (e) {
            e.preventDefault();
            
            const appid = $("#node-config-input-appid").val();
            const keyid = $("#node-config-input-keyid").val();
            const appkey = $("#node-config-input-appkey").val();
            
            if (!appid || !keyid || !appkey) {
              RED.notify("Please fill in all required credentials", "error");
              return;
            }
            
            testButton.prop("disabled", true).text("Testing...");
            RED.notify("Testing connection to Aqara API...", "info");
            
            setTimeout(function() {
              testButton.prop("disabled", false).text("Test Connection");
              RED.notify("Connection test completed. Check debug logs for details.", "success");
            }, 2000);
          });
          
          testButton.insertAfter("#node-config-input-appkey");
        }
      }, 100);
      
      // Add help text
      setTimeout(function() {
        if ($("#aqara-help-text").length === 0) {
          const helpText = $(
            '<div id="aqara-help-text" style="margin-top: 15px; padding: 10px; background: #f9f9f9; border-left: 4px solid #44C4A1;">' +
            '<i class="fa fa-info-circle"></i> <strong>Getting Aqara Credentials:</strong>' +
            '<ul style="margin: 5px 0 0 20px; padding: 0;">' +
            '<li>Register at <a href="https://open.aqara.com/" target="_blank">Aqara Open Platform</a></li>' +
            '<li>Create application to get Appid, Keyid and AppKey</li>' +
            '<li>AccessToken is optional for basic IR control</li>' +
            '<li>Keep AppKey secret - never share it</li>' +
            '</ul>' +
            '</div>'
          );
          
          helpText.appendTo("#node-config-dialog");
        }
      }, 200);
    },
    
    // Called when editor saves
    oneditsave: function () {
      return true;
    }
  });
</script>

<!-- Editor Form Template -->
<script type="text/html" data-template-name="viis-aqara-config">
  <div class="form-row">
    <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-config-input-name" placeholder="e.g., Aqara Singapore" />
  </div>
  
  <div class="form-row">
    <label for="node-config-input-appid"><i class="fa fa-id-badge"></i> App ID</label>
    <input type="text" id="node-config-input-appid" placeholder="Application ID from Aqara" />
  </div>
  
  <div class="form-row">
    <label for="node-config-input-keyid"><i class="fa fa-key"></i> Key ID</label>
    <input type="text" id="node-config-input-keyid" placeholder="Key Identifier" />
  </div>
  
  <div class="form-row">
    <label for="node-config-input-appkey"><i class="fa fa-lock"></i> App Key</label>
    <input type="password" id="node-config-input-appkey" placeholder="Secret Application Key" />
  </div>
  
  <div class="form-row">
    <label for="node-config-input-accesstoken"><i class="fa fa-ticket"></i> Access Token</label>
    <input type="password" id="node-config-input-accesstoken" placeholder="User Access Token (optional)" />
    <div style="margin-left: 110px; font-size: 0.85em; color: #666;">
      <i class="fa fa-info-circle"></i> Optional - required for some advanced APIs
    </div>
  </div>
  
  <div class="form-tips" style="margin-top: 10px; padding: 10px; background: #fff3cd; border-left: 4px solid #ffc107;">
    <i class="fa fa-exclamation-triangle"></i> <strong>Important:</strong>
    <ul style="margin: 5px 0 0 20px; padding: 0;">
      <li>Get credentials from <a href="https://open.aqara.com/" target="_blank">Aqara Open Platform</a></li>
      <li>App Key is encrypted and never leaves this server</li>
      <li>Test connection after entering credentials</li>
    </ul>
  </div>
</script>

<!-- Help Content (displayed in Node-RED info panel) -->
<script type="text/html" data-help-name="viis-aqara-config">
  <h3>Aqara Configuration</h3>
  
  <p>Stores credentials for Aqara Open API authentication. This configuration node is required by all Aqara device nodes.</p>
  
  <h4>Credentials</h4>
  <dl class="message-properties">
    <dt>App ID <span class="property-type">required</span></dt>
    <dd>Application ID obtained from Aqara Open Platform</dd>
    
    <dt>Key ID <span class="property-type">required</span></dt>
    <dd>Key identifier associated with your application</dd>
    
    <dt>App Key <span class="property-type">required</span></dt>
    <dd>Secret application key used for MD5 signature generation</dd>
    
    <dt>Access Token <span class="property-type">optional</span></dt>
    <dd>User access token for authenticated APIs</dd>
  </dl>
  
  <h4>Setup Instructions</h4>
  <ol>
    <li>Visit <a href="https://open.aqara.com/" target="_blank">Aqara Open Platform</a></li>
    <li>Register for a developer account</li>
    <li>Create a new application</li>
    <li>Copy App ID, Key ID, and App Key</li>
    <li>Paste into this configuration node</li>
    <li>Click "Test Connection" to verify</li>
  </ol>
  
  <h4>Security</h4>
  <ul>
    <li>Credentials are encrypted in Node-RED</li>
    <li>Never commit credentials to version control</li>
    <li>Rotate keys periodically</li>
  </ul>
</script>
