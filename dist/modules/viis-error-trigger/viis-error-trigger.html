<script type="text/javascript">
    RED.nodes.registerType('viis-error-trigger', {
        category: 'VIIS',
        color: '#ffa500',
        defaults: {
            name: { value: "" },
            err_code: { value: "" },
            message: { value: "" },
            severity: { value: "medium" },
            notificationType: { value: "warning" },
            entity: { value: "" }
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-exclamation-triangle",
        label: function() {
            return this.name || this.err_code || "error trigger";
        },
        labelStyle: function() {
            return this.name ? "node_label_italic" : "";
        },
        paletteLabel: "error trigger"
    });
</script>

<script type="text/html" data-template-name="viis-error-trigger">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>

    <div class="form-row">
        <label for="node-input-err_code"><i class="fa fa-code"></i> Error Code</label>
        <input type="text" id="node-input-err_code" placeholder="e.g., TEMP_HIGH, SENSOR_FAIL">
    </div>

    <div class="form-row">
        <label for="node-input-message"><i class="fa fa-comment"></i> Message</label>
        <input type="text" id="node-input-message" placeholder="Error message">
    </div>

    <div class="form-row">
        <label for="node-input-severity"><i class="fa fa-warning"></i> Severity</label>
        <select id="node-input-severity">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
            <option value="critical">Critical</option>
        </select>
    </div>

    <div class="form-row">
        <label for="node-input-notificationType"><i class="fa fa-bell"></i> Type</label>
        <select id="node-input-notificationType">
            <option value="alert">Alert</option>
            <option value="warning">Warning</option>
            <option value="info">Info</option>
            <option value="error">Error</option>
        </select>
    </div>

    <div class="form-row">
        <label for="node-input-entity"><i class="fa fa-cube"></i> Entity</label>
        <input type="text" id="node-input-entity" placeholder="Optional: greenhouse_1, device_001, etc.">

    <div class="form-tips">
        <p><b>Configuration Priority:</b> msg.payload values override node configuration.</p>
        <p><b>Dynamic Usage:</b> Leave fields empty to provide all values via msg.payload.</p>
        <p><b>Required Fields:</b> err_code and message (either in config or msg.payload).</p>
    </div>
</script>

<script type="text/html" data-help-name="viis-error-trigger">
    <p>Creates error/warning notifications from business logic in Node-RED flows.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>Error information object with the following properties:</dd>
        <dd>
            <ul>
                <li><code>err_code</code> (string, required): Error code identifier</li>
                <li><code>message</code> (string, required): Human-readable error message</li>
                <li><code>severity</code> (string): low | medium | high | critical</li>
                <li><code>type</code> (string): alert | warning | info | error</li>
                <li><code>entity</code> (string): Device/entity identifier</li>
                <li><code>metadata</code> (object): Additional error metadata</li>
            </ul>
        </dd>
    </dl>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>notification <span class="property-type">object</span></dt>
        <dd>Created notification object from database</dd>
        <dt>error_code <span class="property-type">string</span></dt>
        <dd>Error code that was used</dd>
        <dt>severity <span class="property-type">string</span></dt>
        <dd>Severity level that was used</dd>
    </dl>

    <h3>Details</h3>
    <p>This node creates notifications for business logic errors detected in your Node-RED flows.</p>
    <p>Values can be provided either through node configuration or dynamically via msg.payload. msg.payload values take precedence.</p>

    <h3>Example Usage</h3>
    <h4>Static Configuration</h4>
    <p>Configure all fields in the node editor for fixed error types.</p>

    <h4>Dynamic via Function Node</h4>
    <pre>
msg.payload = {
    err_code: "TEMP_EXCEED",
    message: "Temperature 38°C exceeds threshold 35°C",
    severity: "high",
    type: "warning",
    entity: "greenhouse_1",
    metadata: {
        current_temp: 38,
        threshold: 35,
        location: "Zone A"
    }
};
return msg;
    </pre>

    <h3>Deduplication</h3>
    <p>The node automatically handles deduplication. If a notification with the same err_code and entity already exists and is unresolved, it will update the occurrence count instead of creating a duplicate.</p>

    <h3>Status Indicators</h3>
    <ul>
        <li><b>Grey ring:</b> Ready</li>
        <li><b>Blue dot:</b> Creating notification</li>
        <li><b>Green dot:</b> Low severity notification created</li>
        <li><b>Yellow dot:</b> Medium severity notification created</li>
        <li><b>Orange dot:</b> High severity notification created</li>
        <li><b>Red dot:</b> Critical severity notification created</li>
        <li><b>Red ring:</b> Error occurred</li>
    </ul>

    <h3>References</h3>
    <ul>
        <li><a href="https://github.com/viis-iot">VIIS IoT Platform</a> - Documentation</li>
    </ul>
</script>
