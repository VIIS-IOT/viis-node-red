<script type="text/html" data-help-name="viis-device-protection">
    <h3>🛡️ VIIS Device Protection v2.0</h3>
    <p>This node monitors Modbus coil states and automatically enforces protection rules (Min/Max/Bypass/Force) to prevent equipment damage.</p>

    <h4>🔧 Configuration</h4>
    <ul>
        <li><b>Name</b> – Optional label for this node.</li>
        <li><b>Board ID</b> – Modbus board identifier (e.g., "board1", "board2"). Default: "board1".</li>
        <li><b>Enable Debug</b> – Enable detailed debug logging with [DEBUG] prefix.</li>
    </ul>

    <h4>⚙️ Environment Configuration</h4>
    <p>The node gets Modbus connection and coil mapping from environment variables:</p>
    <ul>
        <li><code>MODBUS_TYPE</code> (TCP/RTU)</li>
        <li><code>MODBUS_HOST</code>, <code>MODBUS_TCP_PORT</code></li>
        <li><code>MODBUS_SERIAL_PORT</code>, <code>MODBUS_BAUD_RATE</code>, <code>MODBUS_PARITY</code></li>
        <li><code>MODBUS_UNIT_ID</code>, <code>MODBUS_TIMEOUT</code>, <code>MODBUS_RECONNECT_INTERVAL</code></li>
        <li><code>MODBUS_COILS</code> (JSON map of coil names to addresses)</li>
        <li><code>MODBUS_BOARDS</code> (JSON array for multi-board mode)</li>
    </ul>

    <h4>🛡️ Protection Logic</h4>
    <p>The node reads protection configurations from global <code>configKeyValues</code> and enforces them:</p>
    <ul>
        <li><b>Bypass</b> – Skip all protections for manual control</li>
        <li><b>Force ON/OFF</b> – Override logic (still respects safety limits)</li>
        <li><b>Max Time ON</b> – Auto OFF after maximum runtime</li>
        <li><b>Min Time ON</b> – Prevent rapid cycling (must stay ON for minimum time)</li>
        <li><b>Min Off Time</b> – Prevent rapid re-start (must stay OFF for minimum time)</li>
        <li><b>Upper/Lower Limits</b> – Auto control based on sensor readings</li>
    </ul>

    <h4>📊 Configuration Fields</h4>
    <pre>
{
  "lamp_control_1_protect_bypass": false,
  "lamp_control_1_protect_force_on": false,
  "lamp_control_1_protect_force_off": false,
  "lamp_control_1_protect_max_time_on": 3600,
  "lamp_control_1_protect_min_time_on": 60,
  "lamp_control_1_protect_min_off_time": 30,
  "lamp_control_1_protect_upper_temp": 30,
  "lamp_control_1_protect_lower_temp": 22
}
    </pre>

    <h4>📤 Outputs</h4>
    <p>When protection actions are triggered, the node outputs a message:</p>
    <pre>
{
  "payload": {
    "lamp_control_1": false,
    "reason": "Max time ON exceeded (3601.2s/3600s) - Auto OFF",
    "action": "auto_off",
    "writeSuccess": true
  }
}
    </pre>
    <p><b>writeSuccess</b>: true if write + read-back verification succeeded, false otherwise.</p>

    <h4>🔄 Read-Back & MQTT Publishing</h4>
    <p>After writing to Modbus, the node automatically:</p>
    <ol>
        <li>Reads back the coil state to verify write succeeded</li>
        <li>Updates global context <code>coilRegisterData</code> cache</li>
        <li>Publishes to MQTT telemetry topic (if MQTT is connected)</li>
    </ol>
    <p>This ensures data consistency across the system and enables real-time monitoring.</p>

    <h4>📥 Inputs</h4>
        <p>Connect an Inject node (or any upstream node) to trigger protection check on demand.</p>
        <pre>
{
    "boardId": "board1"
}
        </pre>
        <p><code>boardId</code> is optional. If provided, node updates board selection for next checks.</p>

    <h4>🧠 Global Context Used</h4>
    <ul>
        <li><code>configKeyValues</code> – Protection configurations</li>
        <li><code>modbus_board1_coils</code> – Modbus coil address mappings</li>
        <li><code>modbus_board1_holding_registers</code> – Modbus holding register mappings</li>
        <li><code>modbus_board1_input_registers</code> – Modbus input register mappings</li>
        <li><code>sensorRegisterData</code> – Sensor readings (optional)</li>
    </ul>

    <h4>🔁 Behavior</h4>
    <ul>
        <li>Runs protection check only when receiving input message</li>
        <li>Auto-reloads Modbus configuration every 30 seconds</li>
        <li>Node status:
            <ul>
                <li>🟢 <code>Running</code></li>
                <li>🟡 <code>No configKeyValues</code></li>
                <li>🔴 <code>Modbus client failed</code></li>
            </ul>
        </li>
    </ul>

    <h4>🐛 Debug Mode</h4>
    <p>When <b>Enable Debug</b> is checked, the node outputs detailed logs with <code>[DEBUG]</code> prefix:</p>
    <ul>
        <li>Configuration loading status</li>
        <li>Protected coil detection</li>
        <li>Modbus read/write operations</li>
        <li>Protection evaluation results</li>
        <li>Action decisions</li>
    </ul>

    <h4>🧹 Cleanup</h4>
    <p>Automatically clears intervals and releases Modbus client when the node is removed or redeployed.</p>

    <h4>📦 Dependencies</h4>
    <p>Uses <code>ClientRegistry.getModbusClientV2(...)</code> for Modbus connection management.</p>

    <h4>📚 Documentation</h4>
    <p>See README.md for detailed usage examples and troubleshooting.</p>
</script>
