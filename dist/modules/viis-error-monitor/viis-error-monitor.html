<script type="text/javascript">
    RED.nodes.registerType('viis-error-monitor', {
        category: 'VIIS',
        color: '#FFA500',
        defaults: {
            name: { value: "" },
            boardId: { value: "", required: true },
            registerType: { value: "coil", required: true },
            startAddress: { value: 0, required: true, validate: RED.validators.number() }
        },
        inputs: 1,
        outputs: 1,
        icon: "alert.png",
        label: function() {
            return this.name || `Monitor ${this.boardId}`;
        },
        labelStyle: function() {
            return this.name ? "node_label_italic" : "";
        },
        paletteLabel: "error monitor"
    });
</script>

<script type="text/html" data-template-name="viis-error-monitor">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    
    <div class="form-row">
        <label for="node-input-boardId"><i class="fa fa-microchip"></i> Board ID</label>
        <input type="text" id="node-input-boardId" placeholder="e.g., board1">
        <div class="form-tips">
            <b>Tip:</b> Must match board_id in error code mapping JSON file (e.g., board1.json)
        </div>
    </div>
    
    <div class="form-row">
        <label for="node-input-registerType"><i class="fa fa-list"></i> Register Type</label>
        <select id="node-input-registerType">
            <option value="holding">Holding Register</option>
            <option value="input">Input Register</option>
            <option value="coil">Coil</option>
        </select>
    </div>
    
    <div class="form-row">
        <label for="node-input-startAddress"><i class="fa fa-map-marker"></i> Start Address</label>
        <input type="number" id="node-input-startAddress" placeholder="e.g., 500">
        <div class="form-tips">
            <b>Tip:</b> First address of the data array from Modbus getter
        </div>
    </div>
    
    <div class="form-tips" style="margin-top: 15px;">
        <b>Usage:</b><br>
        Connect this node after <code>viis-modbus-getter</code>.<br>
        Input: <code>msg.payload = [false, true, false, ...]</code><br>
        Output: <code>msg.errorMonitor = { checked, notifications, stats }</code><br><br>
        
        <b>Override via msg:</b><br>
        - <code>msg.boardId</code> - Override board ID<br>
        - <code>msg.registerType</code> - Override register type<br>
        - <code>msg.startAddress</code> - Override start address<br>
        - <code>msg.entity</code> or <code>msg.deviceId</code> - Entity ID<br>
    </div>
</script>

<script type="text/html" data-help-name="viis-error-monitor">
    <p>Monitors Modbus data arrays for errors and creates/resolves notifications automatically.</p>
    
    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">array | object</span></dt>
        <dd>Array of values from Modbus, or { data: [...] } format from viis-modbus-getter</dd>
        
        <dt class="optional">boardId <span class="property-type">string</span></dt>
        <dd>Override board ID (must match board_id in error code mapping JSON file)</dd>
        
        <dt class="optional">registerType <span class="property-type">string</span></dt>
        <dd>Override register type: 'holding', 'input', or 'coil'</dd>
        
        <dt class="optional">startAddress <span class="property-type">number</span></dt>
        <dd>Override starting address of the data array</dd>
        
        <dt class="optional">entity | deviceId <span class="property-type">string</span></dt>
        <dd>Unique identifier for the device/entity</dd>
    </dl>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>errorMonitor <span class="property-type">object</span></dt>
        <dd>
            <code>
            {<br>
            &nbsp;&nbsp;checked: 10,<br>
            &nbsp;&nbsp;notifications: {<br>
            &nbsp;&nbsp;&nbsp;&nbsp;created: [{address, value, err_code, message, severity}],<br>
            &nbsp;&nbsp;&nbsp;&nbsp;resolved: [{address, value}]<br>
            &nbsp;&nbsp;},<br>
            &nbsp;&nbsp;stats: {totalChecked, errorsDetected, errorsResolved, lastCheck}<br>
            }
            </code>
        </dd>
    </dl>

    <h3>Details</h3>
    <p>This node monitors Modbus data for errors based on error code mappings loaded via env-loader.</p>
    
    <h4>Error Detection</h4>
    <ul>
        <li><b>Holding/Input registers:</b> value != 0 indicates error</li>
        <li><b>Coils:</b> value === true indicates error</li>
    </ul>
    
    <h4>Auto-resolve</h4>
    <ul>
        <li><b>Holding/Input registers:</b> value === 0 clears error</li>
        <li><b>Coils:</b> value === false clears error</li>
        <li>Only errors with <code>auto_resolve: true</code> in mapping will auto-resolve</li>
    </ul>
    
    <h4>Example Flow</h4>
    <pre>
[viis-modbus-getter] → [viis-error-monitor] → [debug]
   (poll coils)         (check errors)         (output)
    </pre>
    
    <h4>Example msg.payload from viis-modbus-getter</h4>
    <pre>
{
  success: true,
  data: [false, true, false, true]  // Coil values
}
    </pre>
    
    <h3>References</h3>
    <ul>
        <li><a href="https://github.com/viis">Error Code Mapping Documentation</a></li>
        <li><a href="https://github.com/viis">Error Notification Service</a></li>
    </ul>
</script>
