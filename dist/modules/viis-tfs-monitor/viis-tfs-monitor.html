<script type="text/html" data-help-name="viis-tfs-monitor">
    <p>Monitors Total Flow Sensor (TFS) counters to prevent overflow and automatically resets them when needed.</p>
    
    <h3>Configuration</h3>
    <dl class="message-properties">
        <dt>Auto Reset <span class="property-type">boolean</span></dt>
        <dd>Enable automatic counter reset when threshold is reached</dd>
        
        <dt>Cron Schedule <span class="property-type">string</span></dt>
        <dd>Cron expression for monitoring interval (e.g., "0 * * * *" for hourly)</dd>
        
        <dt>Threshold (%) <span class="property-type">number</span></dt>
        <dd>Percentage of max value (65535) to trigger reset (default: 90%)</dd>
        
        <dt>Board ID <span class="property-type">string</span></dt>
        <dd>Modbus board ID for reading TFS registers (e.g., "board1")</dd>
        
        <dt>TFS Keys <span class="property-type">string</span></dt>
        <dd>Comma-separated list of TFS sensor keys (e.g., "tfs01,tfs02,tfs03")</dd>
    </dl>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>topic <span class="property-type">string</span></dt>
        <dd>
            <ul>
                <li><code>"check"</code> - Run immediate monitoring check</li>
                <li><code>"reset"</code> - Manual reset of specific sensor</li>
            </ul>
        </dd>
        
        <dt class="optional">payload.sensor <span class="property-type">string</span></dt>
        <dd>Required when topic is "reset". Sensor key to reset (e.g., "tfs01")</dd>
    </dl>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>
            <code>
            {<br>
            &nbsp;&nbsp;timestamp: "2025-01-20T14:00:00Z",<br>
            &nbsp;&nbsp;sensors: [<br>
            &nbsp;&nbsp;&nbsp;&nbsp;{<br>
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;sensor: "tfs01",<br>
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;integerValue: 58000,<br>
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;threshold: 58982,<br>
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;needsReset: false,<br>
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;resetDone: false<br>
            &nbsp;&nbsp;&nbsp;&nbsp;}<br>
            &nbsp;&nbsp;],<br>
            &nbsp;&nbsp;resetCount: 0,<br>
            &nbsp;&nbsp;threshold: 58982<br>
            }
            </code>
        </dd>
    </dl>

    <h3>Details</h3>
    <p>This node monitors TFS (Total Flow Sensor) counters which use 2 Modbus registers per sensor (integer + decimal parts).</p>
    
    <h4>TFS Register Structure</h4>
    <ul>
        <li>Each TFS sensor uses 2 consecutive holding registers</li>
        <li>Register[n]: Integer part (0-65535)</li>
        <li>Register[n+1]: Decimal part (stored as integer, e.g., 4589 = .4589)</li>
        <li>Example: Register[10]=91, Register[11]=4589 → 91.4589 m³</li>
    </ul>
    
    <h4>Overflow Prevention</h4>
    <ul>
        <li>Max register value: 65535</li>
        <li>Default threshold: 90% = 58982</li>
        <li>When integer part ≥ threshold, counter is reset via reset register</li>
        <li>Reset events are logged to database (tabiot_tfs_reset_log)</li>
    </ul>
    
    <h4>Reset Registers</h4>
    <p>Each TFS sensor has a corresponding reset register in global context:</p>
    <pre>
MODBUS_BOARD1_HOLDING_REGISTERS={
  "tfs01": 10,     // Integer register
  "reset_tfs01": 30,  // Reset register
  ...
}
    </pre>
    
    <h4>Database Logging</h4>
    <p>All reset events are logged with:</p>
    <ul>
        <li>Device ID</li>
        <li>Sensor key</li>
        <li>Value before reset (full m³ value)</li>
        <li>Reset register address</li>
        <li>Reason (auto/manual/threshold)</li>
        <li>Timestamp</li>
    </ul>
    
    <h4>Example Flow</h4>
    <pre>
[inject: cron] → [viis-tfs-monitor] → [debug]
                     (monitor)         (output)
    </pre>
    
    <h3>References</h3>
    <ul>
        <li><a href="https://github.com/viis">TFS Parsing Documentation</a></li>
        <li><a href="https://github.com/viis">Marine Telemetry System</a></li>
    </ul>
</script>
